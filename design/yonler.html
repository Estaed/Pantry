<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry yönleri</title>
<link rel="stylesheet" href="../../../TarikOS/.brain/skills/tasarim/references/tokens.css">
<link rel="stylesheet" href="../../../TarikOS/.brain/skills/tasarim/assets/fonts/archivo.css">
<style>
  /* Pantry direction test (2026-10-20, round 3). Six whole directions for the main screen, each with
     its list or sheet, both modes. Less boxes, more flow: surfaces sit on the canvas and run into each
     other. Same data everywhere (Tarık's 20 Oct), food drawings in style C. Phones at real size
     (360x780), shown at 72 %; click to enlarge. */
  @font-face { font-family: Manrope; src: url(../../../TarikOS/.brain/skills/tasarim/assets/fonts/Manrope.woff2) format('woff2'); font-weight: 200 800; }
  * { box-sizing: border-box; }
  body.page { margin: 0; background: #161616; color: #EEEEEE; font: 500 16px/1.5 Manrope, system-ui, sans-serif; }
  .page main { max-width: 1500px; margin: 0 auto; padding: 44px 32px 120px; }
  .page h1 { font: 700 40px/1.05 Archivo, sans-serif; font-stretch: 118%; letter-spacing: -0.8px; margin: 0 0 10px; }
  .page .lede { color: #ABABAB; max-width: 58ch; margin: 0; font-size: 15px; }
  .page .lede b { color: #EEEEEE; }
  .page h2 { font: 700 24px/1.15 Archivo, sans-serif; font-stretch: 118%; margin: 64px 0 6px; }
  .page h2 + p { color: #ABABAB; margin: 0 0 18px; font-size: 15px; max-width: 58ch; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; zoom: 0.72; }
  .cap { width: 360px; font: 600 15px Manrope; color: #ABABAB; margin-top: 8px; }

  .phone { background-color: var(--canvas); color: var(--ink); font-family: var(--font-sans); width: 360px; height: 780px; border-radius: 32px; overflow: hidden; border: 1px solid #3A3A3A; display: flex; flex-direction: column; position: relative; flex: none; cursor: zoom-in; }
  .phone * { font-variant-numeric: tabular-nums; }
  .eyebrow { font: 600 12px/1.3 var(--font-sans); color: var(--ink-muted); }
  .title { font: var(--display-weight) 29px/1.06 var(--font-display); font-stretch: var(--display-stretch); letter-spacing: -0.5px; margin-top: 2px; }
  .disp { font-family: var(--font-display); font-weight: var(--display-weight); font-stretch: var(--display-stretch); }
  .top { padding: 18px 12px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nav { display: flex; }
  .ibtn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); border-radius: var(--r-md); flex: none; }
  .ibtn.box { background: var(--surface-2); width: 48px; height: 48px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .btn { height: 48px; border-radius: var(--r-button); background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px var(--font-sans); border: 0; width: 100%; }
  .btn svg.i { width: 20px; height: 20px; }
  .bottom { margin-top: auto; padding: 0 20px 18px; display: flex; gap: 10px; align-items: center; }
  .acc { color: var(--primary-display); }
  .mut { color: var(--ink-muted); }
  .sub { color: var(--ink-subtle); }
  .fig { font: 600 12px var(--font-figure); color: var(--ink-subtle); }
  .food svg { display: block; }

  /* flowing list: no card, hairlines between rows, drawing in a soft circle */
  .flow { display: flex; flex-direction: column; }
  .fr { display: flex; align-items: center; gap: 14px; padding: 8px 0; min-height: 60px; }
  .fr + .fr { border-top: 1px solid var(--hairline); }
  .fr .food { width: 46px; height: 46px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .fr .food svg { width: 38px; height: 38px; }
  .fr .t { flex: 1; min-width: 0; font: 600 15px/1.3 var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fr .t span { display: block; font: 500 13px var(--font-figure); color: var(--ink-muted); }
  .fr .add { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--hairline-strong); display: grid; place-items: center; color: var(--ink); flex: none; }
  .fr .add svg.i { width: 18px; height: 18px; }

  /* D1 Akış: no boxes, the ring sits on the canvas */
  .d1 .ring { position: relative; width: 220px; height: 220px; margin: 18px auto 0; }
  .d1 .ring svg { width: 100%; height: 100%; }
  .d1 .ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .d1 .ring .num { font-size: 58px; line-height: 1; letter-spacing: -1.5px; }
  .d1 .mrow { display: grid; grid-template-columns: repeat(3, 1fr); margin: 22px 20px 0; }
  .d1 .mrow > div { padding: 0 12px; } .d1 .mrow > div + div { border-left: 1px solid var(--hairline); }
  .d1 .mrow b { display: block; font: 700 17px var(--font-sans); } .d1 .mrow b small { font: 600 12px var(--font-figure); color: var(--ink-subtle); }
  .line { height: 3px; border-radius: 3px; background: var(--surface-3); margin-top: 6px; } .line i { display: block; height: 100%; border-radius: 3px; background: var(--ink-muted); }
  .d1 .wk { margin: 26px 20px 0; }
  .wbars { display: flex; align-items: flex-end; gap: 8px; height: 70px; position: relative; }
  .wbars i { flex: 1; background: var(--chart-neutral); border-radius: 3px; } .wbars i.k { background: var(--chart-1); }
  .wbars .bud { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ink-subtle); }
  .wlab { display: flex; gap: 8px; margin-top: 6px; } .wlab span { flex: 1; text-align: center; font: 600 11px var(--font-sans); color: var(--ink-subtle); } .wlab span.k { color: var(--primary-text); }

  /* D2 Tabak: the plate is the chart, today's food sits on it, every day is a small plate */
  .d2 .plate { position: relative; width: 250px; height: 250px; margin: 12px auto 0; }
  .d2 .plate svg.rim { width: 100%; height: 100%; }
  .d2 .plate .on { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -78%); }
  .d2 .plate .on svg { width: 96px; height: 96px; }
  .d2 .plate .mid { position: absolute; left: 0; right: 0; bottom: 50px; text-align: center; }
  .d2 .plate .num { font-size: 40px; line-height: 1; letter-spacing: -1px; }
  .d2 .legend { display: flex; justify-content: center; gap: 16px; margin-top: 6px; font: 600 13px var(--font-sans); color: var(--ink-muted); }
  .d2 .legend b { color: var(--ink); font: 700 13px var(--font-figure); margin-left: 4px; }
  .d2 .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .d2 .mac { display: flex; height: 8px; gap: 3px; margin: 22px 20px 0; }
  .d2 .mac i { border-radius: 9999px; }
  .d2 .macl { display: flex; justify-content: space-between; margin: 8px 20px 0; font: 500 13px var(--font-sans); color: var(--ink-muted); }
  .d2 .macl b { color: var(--ink); font-weight: 700; }
  .d2 .pies { display: flex; justify-content: space-between; margin: 26px 20px 0; }
  .d2 .pies div { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 11px var(--font-sans); color: var(--ink-subtle); }
  .d2 .pies div.k { color: var(--primary-text); }
  .d2 .pies svg { width: 34px; height: 34px; }

  /* D3 Şerit: big editorial number, one long budget strip, foods as a carousel */
  .d3 .big { margin: 14px 20px 0; font-size: 104px; line-height: .9; letter-spacing: -4px; }
  .d3 .bigsub { margin: 6px 20px 0; font: 600 14px var(--font-sans); color: var(--ink-muted); }
  .d3 .strip { display: flex; height: 18px; margin: 20px 20px 0; border-radius: 9999px; overflow: hidden; background: var(--surface-3); }
  .d3 .strip i { height: 100%; } .d3 .strip i + i { border-left: 2px solid var(--canvas); }
  .d3 .stl { display: flex; justify-content: space-between; margin: 6px 20px 0; font: 600 12px var(--font-figure); color: var(--ink-subtle); }
  .d3 .hb { display: grid; grid-template-columns: 64px 1fr 74px; gap: 10px 12px; align-items: center; margin: 22px 20px 0; font: 600 14px var(--font-sans); }
  .d3 .hb .line { margin: 0; height: 8px; border-radius: 8px; } .d3 .hb .line i { border-radius: 8px; }
  .d3 .hb .v { text-align: right; font: 700 14px var(--font-figure); } .d3 .hb .v small { color: var(--ink-subtle); font-weight: 600; }
  .d3 .carh { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 20px 10px; }
  .d3 .car { display: flex; gap: 10px; padding: 0 20px; overflow: hidden; }
  .d3 .tile { width: 104px; flex: none; }
  .d3 .tile .food { height: 104px; border-radius: 22px; background: var(--surface-2); display: grid; place-items: center; position: relative; }
  .d3 .tile .food svg { width: 70px; height: 70px; }
  .d3 .tile .food .plus { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; border-radius: 50%; background: var(--action); color: var(--on-action); display: grid; place-items: center; }
  .d3 .tile .food .plus svg.i { width: 16px; height: 16px; }
  .d3 .tile b { display: block; font: 600 13px/1.25 var(--font-sans); margin-top: 6px; }
  .d3 .tile span { font: 500 12px var(--font-figure); color: var(--ink-muted); }

  /* D4 Katman: the day on the canvas, the food list as one sheet that is always there */
  .d4 .head { display: flex; align-items: center; gap: 18px; padding: 10px 20px 0; }
  .d4 .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .d4 .ring svg { width: 100%; height: 100%; }
  .d4 .ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .d4 .ring .num { font-size: 34px; line-height: 1; letter-spacing: -1px; }
  .d4 .mm { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .d4 .mm .r { font: 600 13px var(--font-sans); color: var(--ink-muted); display: flex; justify-content: space-between; }
  .d4 .mm .r b { color: var(--ink); font: 700 13px var(--font-figure); }
  .d4 .mm .line { margin-top: 4px; }
  .d4 .sheet { margin-top: 18px; flex: 1; background: var(--surface-1); border-top: 1px solid var(--hairline); border-radius: 28px 28px 0 0; padding: 8px 20px 0; display: flex; flex-direction: column; }
  .d4 .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--hairline); }
  .d4 .tabs span { padding: 12px 0 10px; font: 600 14px var(--font-sans); color: var(--ink-subtle); position: relative; }
  .d4 .tabs span em { font-style: normal; font: 600 11px var(--font-figure); margin-left: 4px; }
  .d4 .tabs span.on { color: var(--ink); } .d4 .tabs span.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--primary); }
  .d4 .srch { display: flex; gap: 8px; margin: 12px 0 4px; }
  .d4 .srch .in { flex: 1; height: 44px; border-radius: 22px; background: var(--surface-2); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--ink-muted); font: 500 15px var(--font-sans); }
  .d4 .srch .in svg.i, .d4 .srch .sc svg.i { width: 18px; height: 18px; }
  .d4 .srch .sc { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }

  /* D5 Izgara: the main screen is the picker, foods as a grid of drawings */
  .d5 .bar { display: flex; align-items: center; gap: 14px; padding: 12px 20px 0; }
  .d5 .bar .ring { position: relative; width: 76px; height: 76px; flex: none; }
  .d5 .bar .ring svg { width: 100%; height: 100%; }
  .d5 .bar .num { font-size: 34px; line-height: 1; letter-spacing: -1px; }
  .d5 .mini { display: flex; gap: 8px; margin-top: 8px; }
  .d5 .mini div { flex: 1; font: 600 11px var(--font-sans); color: var(--ink-subtle); }
  .d5 .mini .line { height: 4px; margin-top: 4px; }
  .d5 .chipr { display: flex; gap: 8px; padding: 16px 20px 0; }
  .d5 .chip { white-space: nowrap; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--hairline-strong); display: inline-flex; align-items: center; font: 600 14px var(--font-sans); color: var(--ink-muted); }
  .d5 .chip.on { background: var(--action); border-color: var(--action); color: var(--on-action); }
  .d5 .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 10px; padding: 16px 20px 0; }
  .d5 .g .food { width: 84px; margin: 0 auto; aspect-ratio: 1; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
  .d5 .g .food svg { width: 62%; height: 62%; }
  .d5 .g b { display: block; text-align: center; font: 600 13px/1.2 var(--font-sans); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d5 .g span { display: block; text-align: center; font: 500 12px var(--font-figure); color: var(--ink-muted); }
  .d5 .g.sel .food { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--primary); }

  /* D6 Gösterge: a half dial, meals as marks along it, the week as a dotted line */
  .d6 .dial { position: relative; width: 320px; height: 190px; margin: 18px auto 0; }
  .d6 .dial svg { width: 100%; height: 100%; overflow: visible; }
  .ate { margin: 22px 20px 0; } .ate .fr { min-height: 52px; }
  .d6 .dial .mid { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
  .d6 .dial .num { font-size: 64px; line-height: 1; letter-spacing: -2px; }
  .d6 .cols { display: flex; justify-content: center; gap: 30px; margin-top: 18px; }
  .d6 .cols div { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 600 12px var(--font-sans); color: var(--ink-muted); }
  .d6 .cols .tube { width: 14px; height: 58px; border-radius: 7px; background: var(--surface-3); display: flex; align-items: flex-end; overflow: hidden; }
  .d6 .cols .tube i { width: 100%; background: var(--ink-muted); border-radius: 7px; }
  .d6 .cols b { color: var(--ink); font: 700 13px var(--font-figure); }
  .d6 .wl { margin: 20px 20px 0; }
  .d6 .wl svg { width: 100%; height: 64px; overflow: visible; }

  /* gram sheet, flowing: big drawing first, no boxes */
  .scrim { position: absolute; inset: 0; background: var(--scrim); }
  .gs { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface-1); border-radius: 28px 28px 0 0; border-top: 1px solid var(--hairline-strong); padding: 10px 20px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: var(--shadow-3); }
  .gs .handle { width: 36px; height: 4px; border-radius: 4px; background: var(--hairline-strong); }
  .gs .hero { width: 116px; height: 116px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
  .gs .hero svg { width: 86px; height: 86px; }
  .gs h4 { margin: 0; font: 700 19px var(--font-sans); text-align: center; }
  .gs .per { font: 500 13px var(--font-sans); color: var(--ink-muted); margin-top: -10px; }
  .gs .amt { display: flex; align-items: baseline; gap: 18px; }
  .gs .amt .g { font-size: 44px; line-height: 1; letter-spacing: -1px; border-bottom: 2px solid var(--primary); padding: 0 4px 2px; }
  .gs .amt .g small, .gs .amt .k small { font: 600 15px var(--font-sans); color: var(--ink-muted); letter-spacing: 0; margin-left: 4px; }
  .gs .amt .k { font-size: 28px; line-height: 1; color: var(--ink-muted); }
  .gs .chips { display: flex; gap: 8px; }
  .gs .chip { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--hairline-strong); display: inline-flex; align-items: center; font: 600 14px var(--font-sans); }
  .gs .chip.on { background: var(--action); color: var(--on-action); border-color: var(--action); }
  .gs .split { width: 100%; }
  .gs .split .s { display: flex; height: 8px; gap: 3px; } .gs .split .s i { border-radius: 9999px; }
  .gs .split .l { display: flex; justify-content: space-between; margin-top: 8px; font: 500 13px var(--font-sans); color: var(--ink-muted); }
  .gs .split .l b { color: var(--ink); }
  .gs .more { width: 100%; display: flex; justify-content: space-between; align-items: center; min-height: 40px; font: 600 14px var(--font-sans); color: var(--ink-muted); border-top: 1px solid var(--hairline); }
  .gs .more svg.i { width: 18px; height: 18px; }
  .page :focus-visible, .phone :focus-visible { outline: 2px solid var(--primary, #FF5A00); outline-offset: 2px; }
  #zoom { position: fixed; inset: 0; background: #000000D9; display: none; place-items: center; z-index: 9; cursor: zoom-out; }
  #zoom.on { display: grid; }
  #zoom > * { zoom: 1.1; }
</style>
</head>
<body class="page">
<main>
  <h1>Pantry, altı yön</h1>
  <p class="lede">Kutu kutu yerine akan ekranlar. Her yön ana ekranı ve ekleme anını gösteriyor; veriler aynı (senin 20 Ekim'in), yemek çizimleri C. Parça parça seçebilirsin: <b>"D2'nin tabağı, D4'ün listesi"</b> gibi.</p>
  <div id="all"></div>
</main>
<div id="zoom"></div>
<script>
const P = {
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>', down: '<path d="m6 9 6 6 6-6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M8 7v10M12 7v10M16 7v10"/>',
  plus: '<path d="M5 12h14M12 5v14"/>' };
const ic = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const n = v => Math.round(v).toLocaleString('tr-TR');

// Style C food drawings, 48x48: [kind, d, colour]; 'f' fill, 'l' line.
const F = {
  chicken: [['f', 'M9 31c-2-8 5-17 16-18 8-1 14 3 14 9 0 8-9 14-19 15-6 0-10-2-11-6z', '#F2B2A2'], ['l', 'M15 28c5-4 11-6 18-6M17 33c4-2 9-3 13-3', '#D98875']],
  tzatziki: [['f', 'M6 25h36c0 9-8 15-18 15S6 34 6 25z', '#4F86B8'], ['f', 'M9 25c2-6 8-9 15-9s13 3 15 9z', '#F4F1E8'], ['f', 'M17 20.5a1.6 1.6 0 1 0 0.1 0zM25 18.5a1.6 1.6 0 1 0 0.1 0zM31 21a1.6 1.6 0 1 0 0.1 0z', '#6E9E4A']],
  rice: [['f', 'M6 26h36c0 8-8 14-18 14S6 34 6 26z', '#B9B2A6'], ['f', 'M9 26c1-8 7-12 15-12s14 4 15 12z', '#FBF8F0'], ['l', 'M16 21l3-1M23 18h3M29 21l3 1M20 24h3', '#D8CFBA']],
  butter: [['f', 'M5 34h38l-4 5H9z', '#CFCFCF'], ['f', 'M11 21l19-5 8 6v10l-19 5-8-6z', '#F5D664'], ['l', 'M11 21l8 6 19-5M19 27v10', '#D9B43C']],
  potato: [['f', 'M7 27c0-8 8-14 18-14s16 5 16 12-8 12-18 12S7 34 7 27z', '#D6A468'], ['f', 'M16 23.5a1.4 1.4 0 1 0 0.1 0zM28 21a1.4 1.4 0 1 0 0.1 0zM31 30a1.4 1.4 0 1 0 0.1 0zM20 31a1.2 1.2 0 1 0 0.1 0z', '#8A5A2B']],
  pizza: [['f', 'M11 19c8-4 18-4 26 0L24 42z', '#F2C65A'], ['f', 'M8 14c10-5 22-5 32 0l-3 5c-8-4-18-4-26 0z', '#D49A4C'], ['f', 'M20 22.5a2.6 2.6 0 1 0 0.1 0zM28.5 22a2.4 2.4 0 1 0 0.1 0zM24 29.5a2.4 2.4 0 1 0 0.1 0z', '#C84A31']],
  tuna: [['f', 'M9 22v12c0 3 7 5 15 5s15-2 15-5V22', '#B6BCC2'], ['f', 'M9 27c0 3 7 5 15 5s15-2 15-5v5c0 3-7 5-15 5S9 35 9 32z', '#2F6DB5'], ['f', 'M9 22c0-3 7-5 15-5s15 2 15 5-7 5-15 5-15-2-15-5z', '#DDE2E6']],
  eggs: [['f', 'M17 40c-6 0-9-5-9-11s4-15 9-15 9 9 9 15-3 11-9 11z', '#F1E2CD'], ['f', 'M31 40c-5 0-8-4-8-9s4-12 8-12 8 7 8 12-3 9-8 9z', '#E3C9A6']],
};
const art = k => `<svg viewBox="0 0 48 48" aria-hidden="true">${F[k].map(([t, d, c]) => t === 'l' ? `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round"/>` : `<path d="${d}" fill="${c}"/>`).join('')}</svg>`;

const T = { kcal: 2200, c: 248, p: 110, f: 86 };
const D = { kcal: 1304, c: 143.2, p: 66.8, f: 47.6, meals: [1304, 0, 0, 0] };
const LEFT = T.kcal - D.kcal, FR = D.kcal / T.kcal;
const WEEK = [['Ç', 2292], ['P', 2149], ['C', 2217], ['C', 2292], ['P', 2568], ['P', 2292], ['S', 1304]];
const FOODS = [['chicken', 'Chicken breast raw', '350 g', 378], ['tzatziki', 'Tzatziki dip', '125 g', 113], ['rice', 'Basmati rice', '100 g', 360],
  ['butter', 'Spreadable butter', '10 g', 62], ['potato', 'White potato', '350 g', 206], ['pizza', 'Margherita pizza', '500 g', 1304],
  ['tuna', 'Tuna in olive oil', '140 g', 265], ['eggs', 'Eggs XL', '4 eggs', 296], ['rice', 'Basmati, 90 sec', '250 g', 383]];
const MEALS = ['Kahvaltı', 'Öğle', 'Akşam', 'Ara öğün'];
const MAC = [['Protein', D.p, T.p], ['Karb', D.c, T.c], ['Yağ', D.f, T.f]];

const pt = (cx, cy, r, a) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
const arc = (cx, cy, r, a0, a1) => { const [x0, y0] = pt(cx, cy, r, a0), [x1, y1] = pt(cx, cy, r, a1); return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
const ringSvg = (size, w, f, track = 'var(--surface-3)', fill = 'var(--ink)') => { const c = size / 2, r = c - w / 2 - 2;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${track}" stroke-width="${w}"/><path d="${arc(c, c, r, 0, 360 * f)}" fill="none" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/></svg>`; };
const head = (t = 'Bugün') => `<div class="top"><div><div class="eyebrow">Salı, 20 Ekim</div><div class="title">${t}</div></div><div class="nav"><span class="ibtn">${ic('left')}</span><span class="ibtn">${ic('right')}</span></div></div>`;
const addBar = (label = 'Akşama ekle') => `<div class="bottom"><button class="btn">${ic('plus')}${label}</button><span class="ibtn box">${ic('scan')}</span></div>`;
const wbars = h => { const max = 2700; return `<div class="wbars" style="height:${h}px"><div class="bud" style="bottom:${T.kcal / max * h}px"></div>${WEEK.map(([, v], i) => `<i class="${i === 6 ? 'k' : ''}" style="height:${v / max * h}px"><title>${n(v)} kcal</title></i>`).join('')}</div>
  <div class="wlab">${WEEK.map(([d], i) => `<span class="${i === 6 ? 'k' : ''}">${d}</span>`).join('')}</div>`; };
const flow = (rows, pad = true) => `<div class="flow" style="${pad ? 'padding:0 20px' : ''}">${rows.map(([k, t, a, kc]) => `<div class="fr"><span class="food">${art(k)}</span><span class="t">${t}<span>${a}, ${n(kc)} kcal</span></span><span class="add">${ic('plus')}</span></div>`).join('')}</div>`;
const ate = () => `<div class="ate"><div class="eyebrow">Bugün yediklerin</div><div class="flow"><div class="fr"><span class="food">${art('pizza')}</span><span class="t">Margherita pizza<span>Kahvaltı, 500 g</span></span><span class="fig" style="font-size:14px;color:var(--ink)">1.304</span></div></div></div>`;
const listHead = () => `<div class="top" style="padding-left:8px;justify-content:flex-start"><span class="ibtn">${ic('left')}</span><div><div class="eyebrow">Salı, 20 Ekim</div><div class="title">Akşam</div></div></div>
  <div style="display:flex;gap:8px;padding:14px 20px 6px"><div style="flex:1;height:46px;border-radius:23px;background:var(--surface-2);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--ink-muted);font:500 15px var(--font-sans)">${ic('search')}Yemek ya da marka</div><span class="ibtn box" style="border-radius:50%;width:46px;height:46px">${ic('scan')}</span></div>`;
const gsheet = (under) => `${under}<div class="scrim"></div><div class="gs"><div class="handle"></div><div class="hero">${art('chicken')}</div>
  <h4>Chicken breast raw</h4><div class="per">100 g'da 108 kcal</div>
  <div class="amt"><span class="g disp">350<small>g</small></span><span class="k disp">378<small>kcal</small></span></div>
  <div class="chips"><span class="chip on">350 g</span><span class="chip">375 g</span><span class="chip">300 g</span><span class="chip">400 g</span></div>
  <div class="split"><div class="s"><i style="flex:76;background:var(--ink)"></i><i style="flex:1;background:var(--ink-muted)"></i><i style="flex:25;background:var(--chart-neutral)"></i></div>
  <div class="l"><span>Protein <b>71 g</b></span><span>Karb <b>0 g</b></span><span>Yağ <b>10,5 g</b></span></div></div>
  <div class="more">Tüm besinler${ic('down')}</div><button class="btn">Akşama ekle</button></div>`;

const DIRS = [
  ['D1', 'Akış', 'Hiç kutu yok: halka tuvalin ortasında, makrolar ince çizgilerle altında, hafta en altta. Liste de kutusuz, yuvarlak çizimlerle.', {
    main: () => `${head()}<div class="d1"><div class="ring">${ringSvg(220, 14, FR)}<div class="mid"><span class="num disp acc">${n(LEFT)}</span><span class="mut" style="font:600 13px var(--font-sans)">kcal kaldı</span>
      <span class="fig" style="margin-top:6px">${n(D.kcal)} / ${n(T.kcal)}</span></div></div>
      <div class="mrow">${MAC.map(([l, v, t]) => `<div><span class="eyebrow">${l}</span><b>${n(v)} <small>/ ${n(t)} g</small></b><div class="line"><i style="width:${v / t * 100}%"></i></div></div>`).join('')}</div>
      <div class="wk"><div class="eyebrow" style="margin-bottom:8px">Son 7 gün</div>${wbars(64)}</div>${ate()}</div>${addBar()}`,
    second: () => `${listHead()}${flow(FOODS.slice(0, 8))}`, cap2: 'Öğüne dokununca' }],
  ['D2', 'Tabak', 'Grafik bir tabak: kenarı öğünlerle doluyor, bugün yediğin üstünde duruyor. Her gün küçük bir tabak, bugünkü turuncu.', {
    main: () => { const c = 125, r = 112; let a = 0; const segs = D.meals.map((v, i) => { const s = a, e = a + v / T.kcal * 360; a = e; return v ? `<path d="${arc(c, c, r, s + 1, e - 1)}" stroke="var(--ink)" stroke-width="10" fill="none" stroke-linecap="round"/>` : ''; }).join('');
      const pies = WEEK.map(([d, v], i) => { const f = Math.min(1, v / T.kcal), col = i === 6 ? 'var(--chart-1)' : 'var(--chart-neutral)';
        const body = f >= 1 ? `<circle cx="17" cy="17" r="13" fill="${col}"/><circle cx="17" cy="17" r="15.5" fill="none" stroke="var(--ink-muted)" stroke-width="1.5"/>` : `<circle cx="17" cy="17" r="13" fill="var(--surface-3)"/><path d="M17 17L${pt(17, 17, 13, 0).join(' ')}A13 13 0 ${f > .5 ? 1 : 0} 1 ${pt(17, 17, 13, 360 * f).map(v => v.toFixed(1)).join(' ')}Z" fill="${col}"/>`;
        return `<div class="${i === 6 ? 'k' : ''}"><svg viewBox="0 0 34 34">${body}<title>${n(v)} kcal</title></svg>${d}</div>`; }).join('');
      return `${head()}<div class="d2"><div class="plate"><svg class="rim" viewBox="0 0 250 250" aria-hidden="true"><circle cx="125" cy="125" r="112" fill="none" stroke="var(--surface-3)" stroke-width="10"/>
        <circle cx="125" cy="125" r="98" fill="var(--surface-1)" stroke="var(--hairline)"/><circle cx="125" cy="125" r="78" fill="none" stroke="var(--hairline)"/>${segs}</svg>
        <div class="on">${art('pizza')}</div><div class="mid"><span class="num disp acc">${n(LEFT)}</span><div class="mut" style="font:600 12px var(--font-sans)">kcal kaldı</div></div></div>
        <div class="legend">${MEALS.map((m, i) => `<span>${m}<b>${D.meals[i] ? n(D.meals[i]) : '·'}</b></span>`).join('')}</div>
        <div class="mac"><i style="flex:${D.p};background:var(--ink)"></i><i style="flex:${D.c};background:var(--ink-muted)"></i><i style="flex:${D.f};background:var(--chart-neutral)"></i></div>
        <div class="macl">${MAC.map(([l, v, t]) => `<span>${l} <b>${n(v)}</b>/${n(t)} g</span>`).join('')}</div>
        <div class="pies">${pies}</div></div>${addBar()}`; },
    second: () => gsheet(`${listHead()}${flow(FOODS.slice(0, 6))}`), cap2: 'Yemeğe dokununca' }],
  ['D3', 'Şerit', 'Dergi gibi: kocaman sayı, tek uzun bütçe şeridi (öğünler parça parça), makrolar yatay barlar, sık yediklerin kaydırılan büyük kareler.', {
    main: () => { const cols = ['var(--ink)', 'var(--ink-muted)', 'var(--chart-neutral)', 'var(--hairline-strong)'];
      return `${head()}<div class="d3"><div class="big disp acc">${n(LEFT)}</div><div class="bigsub">kcal kaldı, ${n(D.kcal)} yendi</div>
        <div class="strip">${D.meals.map((v, i) => v ? `<i style="width:${v / T.kcal * 100}%;background:${cols[i]}"></i>` : '').join('')}</div>
        <div class="stl"><span>Kahvaltı ${n(D.meals[0])}</span><span>2.200</span></div>
        <div class="hb">${MAC.map(([l, v, t]) => `<span class="mut">${l}</span><div class="line"><i style="width:${v / t * 100}%"></i></div><span class="v">${n(v)}<small> / ${n(t)}</small></span>`).join('')}</div>
        <div class="carh"><span class="eyebrow">Akşam için</span><span class="fig">Tümü</span></div>
        <div class="car">${FOODS.slice(0, 4).map(([k, t, a, kc]) => `<div class="tile"><div class="food">${art(k)}<span class="plus">${ic('plus')}</span></div><b>${t}</b><span>${a}, ${n(kc)}</span></div>`).join('')}</div><div style="margin:20px 20px 0">${wbars(44)}</div></div>${addBar('Ara ya da okut')}`; },
    second: () => gsheet(`${head()}<div class="d3"><div class="big disp acc">${n(LEFT)}</div></div>`), cap2: 'Kareye dokununca' }],
  ['D4', 'Katman', 'Tek ekran, senin kullandığın gibi: üstte gün (halka, makrolar), altta hep açık duran bir yaprak; öğün sekmeleri ve listen orada.', {
    main: () => `${head()}<div class="d4"><div class="head"><div class="ring">${ringSvg(132, 12, FR)}<div class="mid"><span class="num disp acc">${n(LEFT)}</span><span class="mut" style="font:600 11px var(--font-sans)">kcal kaldı</span></div></div>
      <div class="mm">${MAC.map(([l, v, t]) => `<div><div class="r">${l}<b>${n(v)} / ${n(t)}</b></div><div class="line"><i style="width:${v / t * 100}%"></i></div></div>`).join('')}</div></div></div>
      <div class="d4" style="flex:1;display:flex;flex-direction:column"><div class="sheet"><div class="tabs">${MEALS.map((m, i) => `<span class="${i === 2 ? 'on' : ''}">${m}${D.meals[i] ? `<em>${n(D.meals[i])}</em>` : ''}</span>`).join('')}</div>
      <div class="srch"><div class="in">${ic('search')}Yemek ya da marka</div><span class="sc">${ic('scan')}</span></div>${flow(FOODS.slice(0, 6), false)}</div></div>`,
    second: () => gsheet(`${head()}`), cap2: 'Yemeğe dokununca' }],
  ['D5', 'Izgara', 'Ana ekran zaten seçici: üstte küçük halka ve makrolar, altta sık yediklerin yuvarlak resimler halinde. Dokun, ekle.', {
    main: () => `${head()}<div class="d5"><div class="bar"><div class="ring">${ringSvg(76, 8, FR)}</div><div style="flex:1"><div><span class="num disp acc">${n(LEFT)}</span> <span class="mut" style="font:600 13px var(--font-sans)">kcal kaldı</span></div>
      <div class="mini">${MAC.map(([l, v, t]) => `<div>${l} ${n(v)}<div class="line"><i style="width:${v / t * 100}%"></i></div></div>`).join('')}</div></div></div>
      <div class="chipr">${MEALS.map((m, i) => `<span class="chip ${i === 2 ? 'on' : ''}">${m}</span>`).join('')}</div>
      <div class="grid">${FOODS.map(([k, t, a, kc], i) => `<div class="g"><div class="food">${art(k)}</div><b>${t}</b><span>${a}</span></div>`).join('')}</div></div>${addBar('Ara ya da okut')}`,
    second: () => gsheet(`${head()}`), cap2: 'Resme dokununca' }],
  ['D6', 'Gösterge', 'Yarım kadran: dolan yay günün kalorisi, uçtaki turuncu nokta şu an. Makrolar üç tüp, hafta noktalı bir çizgi.', {
    main: () => { const cx = 160, cy = 170, r = 140, a0 = -90, aE = -90 + 180 * FR, [ex, ey] = pt(cx, cy, r, aE);
      const ticks = [0, .25, .5, .75, 1].map(f => { const a = -90 + 180 * f, [x1, y1] = pt(cx, cy, r + 14, a), [x2, y2] = pt(cx, cy, r + 20, a); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink-subtle)" stroke-width="1.5"/>`; }).join('');
      const W = 320, H = 64, mx = 2700, mn = 1000, x = i => 8 + i * (W - 16) / 6, y = v => H - 6 - (v - mn) / (mx - mn) * (H - 12);
      return `${head()}<div class="d6"><div class="dial"><svg viewBox="0 0 320 190" aria-hidden="true"><path d="${arc(cx, cy, r, -90, 90)}" stroke="var(--surface-3)" stroke-width="18" fill="none" stroke-linecap="round"/>
        <path d="${arc(cx, cy, r, a0, aE)}" stroke="var(--ink)" stroke-width="18" fill="none" stroke-linecap="round"/>${ticks}<circle cx="${ex}" cy="${ey}" r="7" fill="var(--chart-1)" stroke="var(--canvas)" stroke-width="3"/>
        <text x="${pt(cx, cy, r + 30, -90)[0]}" y="${cy + 4}" text-anchor="middle" style="font:600 11px var(--font-figure)" fill="var(--ink-subtle)">0</text><text x="${pt(cx, cy, r + 30, 90)[0]}" y="${cy + 4}" text-anchor="end" style="font:600 11px var(--font-figure)" fill="var(--ink-subtle)">2.200</text></svg>
        <div class="mid"><span class="num disp">${n(LEFT)}</span><div class="mut" style="font:600 13px var(--font-sans)">kcal kaldı</div></div></div>
        <div class="cols">${MAC.map(([l, v, t]) => `<div><span class="tube"><i style="height:${Math.min(100, v / t * 100)}%"></i></span><b>${n(v)}</b>${l}</div>`).join('')}</div>
        <div class="wl"><div class="eyebrow" style="margin-bottom:6px">Son 7 gün</div><svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${y(2200)}" y2="${y(2200)}" stroke="var(--ink-subtle)" stroke-dasharray="3 3"/>
          <polyline points="${WEEK.map(([, v], i) => `${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--ink-muted)" stroke-width="2"/>${WEEK.map(([, v], i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === 6 ? 5 : 3.5}" fill="${i === 6 ? 'var(--chart-1)' : 'var(--ink-muted)'}"/>`).join('')}</svg>
          <div class="wlab">${WEEK.map(([d], i) => `<span class="${i === 6 ? 'k' : ''}">${d}</span>`).join('')}</div></div>${ate()}</div>${addBar()}`; },
    second: () => `${listHead()}${flow(FOODS.slice(0, 8))}`, cap2: 'Öğüne dokununca' }],
];
const phone = (mode, html, cap) => `<div><div class="phone" data-theme="${mode}" aria-label="${cap}">${html}</div><div class="cap">${cap}</div></div>`;
document.getElementById('all').innerHTML = DIRS.map(([id, name, desc, s]) => `<h2>${id}. ${name}</h2><p>${desc}</p><div class="row">
  ${phone('dark', s.main(), 'Ana ekran, koyu')}${phone('light', s.main(), 'Ana ekran, açık')}${phone('dark', s.second(), s.cap2 + ', koyu')}${phone('light', s.second(), s.cap2 + ', açık')}</div>`).join('');

const zoom = document.getElementById('zoom');
document.addEventListener('click', e => {
  if (zoom.classList.contains('on')) { zoom.classList.remove('on'); zoom.innerHTML = ''; return; }
  const p = e.target.closest('.phone'); if (p) { zoom.innerHTML = p.outerHTML; zoom.classList.add('on'); }
});
</script>
</body>
</html>
