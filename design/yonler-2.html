<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry yönleri 2</title>
<link rel="stylesheet" href="../../../TarikOS/.brain/skills/tasarim/references/tokens.css">
<link rel="stylesheet" href="../../../TarikOS/.brain/skills/tasarim/assets/fonts/archivo.css">
<style>
  /* Pantry direction test, round 4 (2026-10-20). Tarık liked D1 Akış, D2 Tabak and D6 Gösterge:
     one round measuring object on the open canvas. Ten variants of that family, main screen only,
     both modes. Same data (Tarık's 20 Oct), food drawings in style C. Phones at real size
     (360x780), shown at 72 %; click to enlarge. */
  @font-face { font-family: Manrope; src: url(../../../TarikOS/.brain/skills/tasarim/assets/fonts/Manrope.woff2) format('woff2'); font-weight: 200 800; }
  * { box-sizing: border-box; }
  body.page { margin: 0; background: #161616; color: #EEEEEE; font: 500 16px/1.5 Manrope, system-ui, sans-serif; }
  .page main { max-width: 1560px; margin: 0 auto; padding: 44px 32px 120px; }
  .page h1 { font: 700 40px/1.05 Archivo, sans-serif; font-stretch: 118%; letter-spacing: -0.8px; margin: 0 0 10px; }
  .page .lede { color: #ABABAB; max-width: 58ch; margin: 0; font-size: 15px; }
  .page .lede b { color: #EEEEEE; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(540px, 1fr)); gap: 40px 32px; margin-top: 36px; }
  .page h2 { font: 700 22px/1.15 Archivo, sans-serif; font-stretch: 118%; margin: 0 0 4px; }
  .page h2 + p { color: #ABABAB; margin: 0 0 14px; font-size: 14px; max-width: 62ch; min-height: 42px; }
  .row { display: flex; gap: 14px; zoom: 0.72; }

  .phone { background-color: var(--canvas); color: var(--ink); font-family: var(--font-sans); width: 360px; height: 780px; border-radius: 32px; overflow: hidden; border: 1px solid #3A3A3A; display: flex; flex-direction: column; position: relative; flex: none; cursor: zoom-in; }
  .phone * { font-variant-numeric: tabular-nums; }
  .eyebrow { font: 600 12px/1.3 var(--font-sans); color: var(--ink-muted); }
  .title { font: var(--display-weight) 29px/1.06 var(--font-display); font-stretch: var(--display-stretch); letter-spacing: -0.5px; margin-top: 2px; }
  .disp { font-family: var(--font-display); font-weight: var(--display-weight); font-stretch: var(--display-stretch); }
  .top { padding: 18px 12px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nav { display: flex; }
  .ibtn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); border-radius: var(--r-md); flex: none; }
  .ibtn.box { background: var(--surface-2); width: 48px; height: 48px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .btn { height: 48px; border-radius: var(--r-button); background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px var(--font-sans); border: 0; width: 100%; }
  .btn svg.i { width: 20px; height: 20px; }
  .bottom { margin-top: auto; padding: 0 20px 18px; display: flex; gap: 10px; align-items: center; }
  .acc { color: var(--primary-display); }
  .mut { color: var(--ink-muted); }
  .fig { font: 600 12px var(--font-figure); color: var(--ink-subtle); }
  .hero { position: relative; margin: 10px auto 0; }
  .hero > svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  .num { line-height: 1; letter-spacing: -1.5px; }
  .lbl { font: 600 13px var(--font-sans); color: var(--ink-muted); margin-top: 4px; }
  .sec { margin: 22px 20px 0; }

  /* shared lower parts */
  .mrow { display: grid; grid-template-columns: repeat(3, 1fr); margin: 20px 20px 0; }
  .mrow > div { padding: 0 12px; } .mrow > div:first-child { padding-left: 0; } .mrow > div + div { border-left: 1px solid var(--hairline); }
  .mrow b { display: block; font: 700 17px var(--font-sans); } .mrow b small { font: 600 12px var(--font-figure); color: var(--ink-subtle); }
  .line { height: 3px; border-radius: 3px; background: var(--surface-3); margin-top: 6px; } .line i { display: block; height: 100%; border-radius: 3px; background: var(--ink-muted); }
  .wbars { display: flex; align-items: flex-end; gap: 8px; position: relative; }
  .wbars i { flex: 1; background: var(--chart-neutral); border-radius: 3px; } .wbars i.k { background: var(--chart-1); }
  .wbars .bud { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ink-subtle); }
  .wlab { display: flex; gap: 8px; margin-top: 6px; } .wlab span { flex: 1; text-align: center; font: 600 11px var(--font-sans); color: var(--ink-subtle); } .wlab span.k { color: var(--primary-text); }
  .pies { display: flex; justify-content: space-between; }
  .pies div { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 11px var(--font-sans); color: var(--ink-subtle); }
  .pies div.k { color: var(--primary-text); }
  .pies svg { width: 34px; height: 34px; }
  .tubes { display: flex; justify-content: center; gap: 34px; margin-top: 16px; }
  .tubes div { display: flex; flex-direction: column; align-items: center; gap: 5px; font: 600 12px var(--font-sans); color: var(--ink-muted); }
  .tubes .tube { width: 14px; height: 54px; border-radius: 7px; background: var(--surface-3); display: flex; align-items: flex-end; overflow: hidden; }
  .tubes .tube i { width: 100%; background: var(--ink-muted); border-radius: 7px; }
  .tubes b { color: var(--ink); font: 700 13px var(--font-figure); }
  .fr { display: flex; align-items: center; gap: 14px; min-height: 52px; }
  .fr + .fr { border-top: 1px solid var(--hairline); }
  .fr .food { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .fr .food svg { width: 36px; height: 36px; }
  .fr .t { flex: 1; min-width: 0; font: 600 15px/1.3 var(--font-sans); }
  .fr .t span { display: block; font: 500 13px var(--font-figure); color: var(--ink-muted); }
  .fr .add { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--hairline-strong); display: grid; place-items: center; flex: none; }
  .fr .add svg.i { width: 18px; height: 18px; }
  .legend { display: flex; justify-content: center; gap: 16px; margin-top: 8px; font: 600 13px var(--font-sans); color: var(--ink-muted); flex-wrap: wrap; }
  .legend b { color: var(--ink); font: 700 13px var(--font-figure); margin-left: 4px; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .corner { position: absolute; font: 600 12px var(--font-sans); color: var(--ink-muted); }
  .corner b { display: block; font: 700 18px var(--font-figure); color: var(--ink); }
  .corner b.none { color: var(--ink-subtle); font-weight: 600; }
  .base { border-top: 1.5px solid var(--ink); margin: 0 20px; display: flex; justify-content: space-between; padding-top: 8px; font: 600 12px var(--font-sans); color: var(--ink-muted); }
  .base b { display: block; font: 700 15px var(--font-figure); color: var(--ink); }
  .base b.none { color: var(--ink-subtle); }
  .page :focus-visible, .phone :focus-visible { outline: 2px solid var(--primary, #FF5A00); outline-offset: 2px; }
  #zoom { position: fixed; inset: 0; background: #000000D9; display: none; place-items: center; z-index: 9; cursor: zoom-out; }
  #zoom.on { display: grid; }
  #zoom > * { zoom: 1.1; }
</style>
</head>
<body class="page">
<main>
  <h1>Pantry, yuvarlak aile</h1>
  <p class="lede">D1, D2 ve D6'dan yola çıkan on varyant. Ortak nokta: ekranın ortasında <b>tek yuvarlak bir ölçü nesnesi</b> (halka, tabak, kadran), kutusuz. Hepsi ana ekran, koyu ve açık. Parça seçebilirsin: <b>"V3'ün köşeleri, V7'nin baloncukları"</b> gibi.</p>
  <div class="grid2" id="all"></div>
</main>
<div id="zoom"></div>
<script>
const P = {
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M8 7v10M12 7v10M16 7v10"/>',
  plus: '<path d="M5 12h14M12 5v14"/>' };
const ic = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const n = v => Math.round(v).toLocaleString('tr-TR');

// Style C food drawings, 48x48: [kind, d, colour].
const F = {
  chicken: [['f', 'M9 31c-2-8 5-17 16-18 8-1 14 3 14 9 0 8-9 14-19 15-6 0-10-2-11-6z', '#F2B2A2'], ['l', 'M15 28c5-4 11-6 18-6M17 33c4-2 9-3 13-3', '#D98875']],
  tzatziki: [['f', 'M6 25h36c0 9-8 15-18 15S6 34 6 25z', '#4F86B8'], ['f', 'M9 25c2-6 8-9 15-9s13 3 15 9z', '#F4F1E8'], ['f', 'M17 20.5a1.6 1.6 0 1 0 0.1 0zM25 18.5a1.6 1.6 0 1 0 0.1 0zM31 21a1.6 1.6 0 1 0 0.1 0z', '#6E9E4A']],
  rice: [['f', 'M6 26h36c0 8-8 14-18 14S6 34 6 26z', '#B9B2A6'], ['f', 'M9 26c1-8 7-12 15-12s14 4 15 12z', '#FBF8F0'], ['l', 'M16 21l3-1M23 18h3M29 21l3 1M20 24h3', '#D8CFBA']],
  pizza: [['f', 'M11 19c8-4 18-4 26 0L24 42z', '#F2C65A'], ['f', 'M8 14c10-5 22-5 32 0l-3 5c-8-4-18-4-26 0z', '#D49A4C'], ['f', 'M20 22.5a2.6 2.6 0 1 0 0.1 0zM28.5 22a2.4 2.4 0 1 0 0.1 0zM24 29.5a2.4 2.4 0 1 0 0.1 0z', '#C84A31']],
};
const art = (k, s = 48, x = 0, y = 0) => `<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true">${F[k].map(([t, d, c]) => t === 'l' ? `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round"/>` : `<path d="${d}" fill="${c}"/>`).join('')}</svg>`;

const T = { kcal: 2200, c: 248, p: 110, f: 86 };
const D = { kcal: 1304, c: 143.2, p: 66.8, f: 47.6, meals: [1304, 0, 0, 0] };
const LEFT = T.kcal - D.kcal, FR = D.kcal / T.kcal;
const WEEK = [['Ç', 2292], ['P', 2149], ['C', 2217], ['C', 2292], ['P', 2568], ['P', 2292], ['S', 1304]];
const MEALS = ['Kahvaltı', 'Öğle', 'Akşam', 'Ara öğün'];
const MAC = [['Protein', D.p, T.p], ['Karb', D.c, T.c], ['Yağ', D.f, T.f]];

const pt = (cx, cy, r, a) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
const f1 = v => v.toFixed(1);
const arc = (cx, cy, r, a0, a1) => { const [x0, y0] = pt(cx, cy, r, a0), [x1, y1] = pt(cx, cy, r, a1); return `M${f1(x0)} ${f1(y0)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f1(x1)} ${f1(y1)}`; };
const wedge = (cx, cy, r, a0, a1) => `M${cx} ${cy}L${pt(cx, cy, r, a0).map(f1).join(' ')}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${pt(cx, cy, r, a1).map(f1).join(' ')}Z`;
const stroke = (d, col, w, cap = 'round') => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="${cap}"/>`;
const head = () => `<div class="top"><div><div class="eyebrow">Salı, 20 Ekim</div><div class="title">Bugün</div></div><div class="nav"><span class="ibtn">${ic('left')}</span><span class="ibtn">${ic('right')}</span></div></div>`;
const addBar = () => `<div class="bottom"><button class="btn">${ic('plus')}Akşama ekle</button><span class="ibtn box">${ic('scan')}</span></div>`;
const mrow = () => `<div class="mrow">${MAC.map(([l, v, t]) => `<div><span class="eyebrow">${l}</span><b>${n(v)} <small>/ ${n(t)} g</small></b><div class="line"><i style="width:${v / t * 100}%"></i></div></div>`).join('')}</div>`;
const tubes = () => `<div class="tubes">${MAC.map(([l, v, t]) => `<div><span class="tube"><i style="height:${Math.min(100, v / t * 100)}%"></i></span><b>${n(v)}</b>${l}</div>`).join('')}</div>`;
const wbars = (h = 56) => { const max = 2700; return `<div class="sec"><div class="eyebrow" style="margin-bottom:8px">Son 7 gün</div><div class="wbars" style="height:${h}px"><div class="bud" style="bottom:${T.kcal / max * h}px"></div>${WEEK.map(([, v], i) => `<i class="${i === 6 ? 'k' : ''}" style="height:${v / max * h}px"><title>${n(v)} kcal</title></i>`).join('')}</div>
  <div class="wlab">${WEEK.map(([d], i) => `<span class="${i === 6 ? 'k' : ''}">${d}</span>`).join('')}</div></div>`; };
const pie = (f, col, r = 13) => f >= 1 ? `<circle cx="17" cy="17" r="${r}" fill="${col}"/><circle cx="17" cy="17" r="${r + 2.5}" fill="none" stroke="var(--ink-muted)" stroke-width="1.5"/>` : `<circle cx="17" cy="17" r="${r}" fill="var(--surface-3)"/><path d="${wedge(17, 17, r, 0, 360 * f)}" fill="${col}"/>`;
const pies = (draw = pie) => `<div class="sec"><div class="pies">${WEEK.map(([d, v], i) => `<div class="${i === 6 ? 'k' : ''}"><svg viewBox="0 0 34 34">${draw(Math.min(1, v / T.kcal), i === 6 ? 'var(--chart-1)' : 'var(--chart-neutral)')}<title>${n(v)} kcal</title></svg>${d}</div>`).join('')}</div></div>`;
const dots = () => { const W = 320, H = 56, mx = 2700, mn = 1000, x = i => 8 + i * (W - 16) / 6, y = v => H - 6 - (v - mn) / (mx - mn) * (H - 12);
  return `<div class="sec"><div class="eyebrow" style="margin-bottom:6px">Son 7 gün</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible" aria-hidden="true"><line x1="0" x2="${W}" y1="${y(2200)}" y2="${y(2200)}" stroke="var(--ink-subtle)" stroke-dasharray="3 3"/>
  <polyline points="${WEEK.map(([, v], i) => `${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--ink-muted)" stroke-width="2"/>${WEEK.map(([, v], i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === 6 ? 5 : 3.5}" fill="${i === 6 ? 'var(--chart-1)' : 'var(--ink-muted)'}"/>`).join('')}</svg>
  <div class="wlab">${WEEK.map(([d], i) => `<span class="${i === 6 ? 'k' : ''}">${d}</span>`).join('')}</div></div>`; };
const ate = () => `<div class="sec"><div class="eyebrow">Bugün yediklerin</div><div class="fr"><span class="food">${art('pizza')}</span><span class="t">Margherita pizza<span>Kahvaltı, 500 g</span></span><span class="fig" style="font-size:14px;color:var(--ink)">1.304</span></div></div>`;
const num = (size, extra = '') => `<span class="num disp acc" style="font-size:${size}px">${n(LEFT)}</span><span class="lbl">kcal kaldı${extra}</span>`;
// macro kcal split of today: protein 4, carbs 4, fat 9 kcal per gram
const MK = [D.p * 4, D.c * 4, D.f * 9], MKC = ['var(--ink)', 'var(--ink-muted)', 'var(--chart-neutral)'];

const V = [
  ['V1', 'Tabak kadran', 'D2 + D6: tabağın üst yarısında 240° kadran, ucunda turuncu nokta. Tabakta bugün yediğin, makrolar tüp, günler küçük tabak.', () => {
    const c = 130, r = 118, a0 = -120, aE = -120 + 240 * FR, [ex, ey] = pt(c, c, r, aE);
    return `${head()}<div class="hero" style="width:260px;height:250px"><svg viewBox="0 0 260 260">${stroke(arc(c, c, r, -120, 120), 'var(--surface-3)', 12)}${stroke(arc(c, c, r, a0, aE), 'var(--ink)', 12)}
      <circle cx="${f1(ex)}" cy="${f1(ey)}" r="7" fill="var(--chart-1)" stroke="var(--canvas)" stroke-width="3"/><circle cx="${c}" cy="${c}" r="92" fill="var(--surface-1)" stroke="var(--hairline)"/><circle cx="${c}" cy="${c}" r="70" fill="none" stroke="var(--hairline)"/>${art('pizza', 74, c - 37, 62)}</svg>
      <div class="over" style="justify-content:flex-end;padding-bottom:58px">${num(38)}</div></div>${tubes()}${pies()}${addBar()}`; }],
  ['V2', 'Dilimli tabak', 'Tabak pasta grafiği: her öğün bir dilim, yediğin yemek kendi diliminin üstünde. Boş kalan tabak, kalan kalori.', () => {
    const c = 120, r = 104, a1 = 360 * FR, [mx, my] = pt(c, c, r * 0.58, a1 / 2);
    return `${head()}<div class="hero" style="width:240px;height:240px;margin-top:16px"><svg viewBox="0 0 240 240"><circle cx="${c}" cy="${c}" r="${r + 10}" fill="none" stroke="var(--hairline-strong)"/><circle cx="${c}" cy="${c}" r="${r}" fill="var(--surface-1)"/>
      <path d="${wedge(c, c, r, 0, a1)}" fill="var(--surface-3)" stroke="var(--canvas)" stroke-width="3"/>${art('pizza', 64, mx - 32, my - 32)}<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--hairline)"/></svg></div>
      <div style="text-align:center;margin-top:10px">${num(48)}</div>
      <div class="legend">${MEALS.map((m, i) => `<span>${m}<b>${D.meals[i] ? n(D.meals[i]) : '·'}</b></span>`).join('')}</div>${mrow()}${pies()}${addBar()}`; }],
  ['V3', 'Köşeli halka', 'MyNetDiary\'nin elması gibi: halka ortada, dört öğün dört köşede. Halka öğün öğün dolar.', () => {
    const c = 110, r = 98; let a = 0;
    const segs = D.meals.map(v => { const s = a, e = a + v / T.kcal * 360; a = e; return v ? stroke(arc(c, c, r, s + 1.5, e - 1.5), 'var(--ink)', 14) : ''; }).join('');
    const cor = (i, st) => `<div class="corner" style="${st}">${MEALS[i]}<b class="${D.meals[i] ? '' : 'none'}">${D.meals[i] ? n(D.meals[i]) : '+'}</b></div>`;
    return `${head()}<div style="position:relative;margin:14px 20px 0;height:250px"><div class="hero" style="width:220px;height:220px;margin:14px auto 0"><svg viewBox="0 0 220 220">${stroke(arc(c, c, r, 0, 359.9), 'var(--surface-3)', 14)}${segs}</svg><div class="over">${num(46)}</div></div>
      ${cor(0, 'left:0;top:0')}${cor(1, 'right:0;top:0;text-align:right')}${cor(2, 'left:0;bottom:0')}${cor(3, 'right:0;bottom:0;text-align:right')}</div>${mrow()}${wbars(50)}${ate()}${addBar()}`; }],
  ['V4', 'İbre', 'Eski bir tartı gibi: yarım kadran, çentikler ve ince bir ibre; ibrenin ucu turuncu. Makrolar üç küçük kadran.', () => {
    const cx = 160, cy = 160, r = 132, aE = -90 + 180 * FR, [tx, ty] = pt(cx, cy, r - 22, aE);
    const ticks = Array.from({ length: 21 }, (_, i) => { const a = -90 + i * 9, L = i % 5 ? 8 : 16, [x1, y1] = pt(cx, cy, r + 4, a), [x2, y2] = pt(cx, cy, r + 4 + L, a); return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${i * 9 <= 180 * FR ? 'var(--ink)' : 'var(--ink-subtle)'}" stroke-width="${i % 5 ? 1.5 : 2.5}"/>`; }).join('');
    const mini = ([l, v, t]) => { const f = Math.min(1, v / t); return `<div style="text-align:center"><svg viewBox="0 0 80 46" style="width:80px;height:46px">${stroke(arc(40, 42, 32, -90, 90), 'var(--surface-3)', 6)}${stroke(arc(40, 42, 32, -90, -90 + 180 * f), 'var(--ink-muted)', 6)}</svg><div style="font:700 15px var(--font-figure);margin-top:-14px">${n(v)}</div><div class="eyebrow">${l}</div></div>`; };
    return `${head()}<div class="hero" style="width:320px;height:180px;margin-top:24px"><svg viewBox="0 0 320 180">${stroke(arc(cx, cy, r, -90, 90), 'var(--surface-3)', 4)}${stroke(arc(cx, cy, r, -90, aE), 'var(--ink)', 4)}${ticks}
      <line x1="${cx}" y1="${cy}" x2="${f1(tx)}" y2="${f1(ty)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="${f1(tx)}" cy="${f1(ty)}" r="6" fill="var(--chart-1)"/><circle cx="${cx}" cy="${cy}" r="9" fill="var(--ink)"/></svg></div>
      <div style="text-align:center;margin-top:12px">${num(54)}</div><div style="display:flex;justify-content:space-around;margin:22px 20px 0">${MAC.map(mini).join('')}</div>${dots()}${addBar()}`; }],
  ['V5', 'İç içe halkalar', 'Dışta kalori, içte üç makro halkası; hepsi aynı merkezde. Ortada kalan kalori, sağda değerler.', () => {
    const c = 95, rs = [86, 68, 54, 40], fs = [FR, D.p / T.p, D.c / T.c, D.f / T.f], cols = ['var(--ink)', 'var(--ink-muted)', 'var(--ink-muted)', 'var(--ink-muted)'], ws = [12, 8, 8, 8];
    const rings = rs.map((r, i) => stroke(arc(c, c, r, 0, 359.9), 'var(--surface-3)', ws[i]) + stroke(arc(c, c, r, 0, 360 * Math.min(1, fs[i])), cols[i], ws[i])).join('');
    return `${head()}<div style="display:flex;align-items:center;gap:16px;margin:22px 20px 0"><div class="hero" style="width:190px;height:190px;margin:0"><svg viewBox="0 0 190 190">${rings}</svg><div class="over"><span class="num disp acc" style="font-size:30px">${n(LEFT)}</span><span class="lbl" style="font-size:11px">kcal kaldı</span></div></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:12px">${[['Kalori', D.kcal, T.kcal, ''], ...MAC.map(([l, v, t]) => [l, v, t, ' g'])].map(([l, v, t, u]) => `<div><div class="eyebrow">${l}</div><div style="font:700 16px var(--font-sans)">${n(v)} <span class="fig">/ ${n(t)}${u}</span></div></div>`).join('')}</div></div>${wbars(60)}${ate()}${addBar()}`; }],
  ['V6', 'Kase', 'Yandan bir kase, yedikçe dolar; kalan kalori kasenin boş kısmında yazar. Günler küçük kaseler.', () => {
    const W = 260, top = 40, bot = 200, lvl = bot - (bot - top) * FR;
    const bowl = `M20 ${top}h220c0 90-50 ${bot - top}-110 ${bot - top}S20 ${top + 90} 20 ${top}z`;
    const bowlMini = (f, col) => `<clipPath id="m${Math.round(f * 1000)}${col.length}"><path d="M3 9h28c0 12-6 20-14 20S3 21 3 9z"/></clipPath><path d="M3 9h28c0 12-6 20-14 20S3 21 3 9z" fill="var(--surface-3)"/><rect x="0" y="${29 - 20 * f}" width="34" height="34" fill="${col}" clip-path="url(#m${Math.round(f * 1000)}${col.length})"/>${f >= 1 ? '<path d="M1 7h32" stroke="var(--ink-muted)" stroke-width="1.5"/>' : ''}`;
    return `${head()}<div class="hero" style="width:${W}px;height:220px;margin-top:20px"><svg viewBox="0 0 ${W} 220"><defs><clipPath id="bw"><path d="${bowl}"/></clipPath></defs><path d="${bowl}" fill="var(--surface-1)"/>
      <rect x="0" y="${lvl}" width="${W}" height="220" fill="var(--surface-3)" clip-path="url(#bw)"/><line x1="0" x2="${W}" y1="${lvl}" y2="${lvl}" stroke="var(--ink)" stroke-width="2" clip-path="url(#bw)"/><path d="${bowl}" fill="none" stroke="var(--hairline-strong)" stroke-width="1.5"/>
      <rect x="96" y="${bot}" width="68" height="10" rx="5" fill="var(--hairline-strong)"/></svg><div class="over" style="justify-content:flex-start;padding-top:${top + 4}px">${num(40)}</div></div>
      ${mrow()}${pies(bowlMini)}${ate()}${addBar()}`; }],
  ['V7', 'Baloncuklu yay', 'D6\'nın kadranı, ama yediğin her şey yayın üstünde bir baloncuk; baloncuk nerede, gün oraya kadar dolu.', () => {
    const cx = 160, cy = 175, r = 140, aE = -90 + 180 * FR, [bx, by] = pt(cx, cy, r, aE);
    return `${head()}<div class="hero" style="width:320px;height:200px;margin-top:30px"><svg viewBox="0 0 320 200">${stroke(arc(cx, cy, r, -90, 90), 'var(--surface-3)', 16)}${stroke(arc(cx, cy, r, -90, aE), 'var(--ink)', 16)}
      <circle cx="${f1(bx)}" cy="${f1(by)}" r="27" fill="var(--surface-1)" stroke="var(--chart-1)" stroke-width="2.5"/>${art('pizza', 38, bx - 19, by - 19)}
      <text x="${cx - r}" y="${cy + 22}" text-anchor="middle" style="font:600 11px var(--font-figure)" fill="var(--ink-subtle)">0</text><text x="${cx + r}" y="${cy + 22}" text-anchor="middle" style="font:600 11px var(--font-figure)" fill="var(--ink-subtle)">2.200</text></svg>
      <div class="over" style="justify-content:flex-end;padding-bottom:6px">${num(58)}</div></div>${tubes()}${dots()}${addBar()}`; }],
  ['V8', 'Makro halkası', 'Tek halka, dolu kısmı makrolara bölünmüş: koyu protein, orta karb, açık yağ. Kalori ve makro aynı şekilde.', () => {
    const c = 110, r = 96, tot = T.kcal; let a = 0;
    const segs = MK.map((v, i) => { const s = a, e = a + v / tot * 360; a = e; return stroke(arc(c, c, r, s + 1, e - 1), MKC[i], 16, 'butt'); }).join('');
    return `${head()}<div class="hero" style="width:220px;height:220px;margin-top:18px"><svg viewBox="0 0 220 220">${stroke(arc(c, c, r, 0, 359.9), 'var(--surface-3)', 16, 'butt')}${segs}</svg><div class="over">${num(48)}</div></div>
      <div class="legend" style="margin-top:14px">${MAC.map(([l, v, t], i) => `<span><i class="sw" style="background:${MKC[i]}"></i>${l}<b>${n(v)}</b><span class="fig"> / ${n(t)} g</span></span>`).join('')}</div>${wbars(56)}${ate()}${addBar()}`; }],
  ['V9', 'Gün doğumu', 'Yarım daire ekranın ortasında bir çizgiye oturur; öğünler o çizginin altında. Altında akşam için sık yediklerin, tek ekran.', () => {
    const cx = 160, cy = 160, r = 142;
    return `${head()}<div class="hero" style="width:320px;height:166px;margin-top:18px"><svg viewBox="0 0 320 166">${stroke(arc(cx, cy, r, -90, 90), 'var(--surface-3)', 14, 'butt')}${stroke(arc(cx, cy, r, -90, -90 + 180 * FR), 'var(--ink)', 14, 'butt')}
      <path d="${arc(cx, cy, 104, -90, 90)}Z" fill="var(--surface-1)"/></svg><div class="over" style="justify-content:flex-end;padding-bottom:6px">${num(46)}</div></div>
      <div class="base">${MEALS.map((m, i) => `<span>${m}<b class="${D.meals[i] ? '' : 'none'}">${D.meals[i] ? n(D.meals[i]) : '–'}</b></span>`).join('')}</div>${mrow()}
      <div class="sec"><div class="eyebrow">Akşam için</div>${[['chicken', 'Chicken breast raw', '350 g, 378 kcal'], ['tzatziki', 'Tzatziki dip', '125 g, 113 kcal'], ['rice', 'Basmati rice', '100 g, 360 kcal']].map(([k, t, s]) => `<div class="fr"><span class="food">${art(k)}</span><span class="t">${t}<span>${s}</span></span><span class="add">${ic('plus')}</span></div>`).join('')}</div>${addBar()}`; }],
  ['V10', 'Sofra', 'D2\'nin tabağı sofrada: iki yanda çatal bıçak, kenar dolar, tabakta bugün yediğin. Altında makrolar ve haftanın tabakları.', () => {
    const c = 120, r = 110;
    const fork = `<g fill="var(--hairline-strong)"><rect x="8" y="40" width="3" height="40" rx="1.5"/><rect x="14" y="40" width="3" height="40" rx="1.5"/><rect x="20" y="40" width="3" height="40" rx="1.5"/><path d="M7 78h17c0 8-4 12-6 12h-5c-2 0-6-4-6-12z"/><rect x="13" y="88" width="5" height="100" rx="2.5"/></g>`;
    const knife = `<g fill="var(--hairline-strong)"><path d="M312 40c-8 6-12 28-12 56h12z"/><rect x="304" y="94" width="8" height="94" rx="4"/></g>`;
    return `${head()}<div class="hero" style="width:320px;height:240px;margin-top:16px"><svg viewBox="0 0 320 240">${fork}${knife}<g transform="translate(40 0)"><circle cx="${c}" cy="${c}" r="${r + 6}" fill="var(--surface-1)" stroke="var(--hairline)"/>
      ${stroke(arc(c, c, r - 6, 0, 359.9), 'var(--surface-3)', 10)}${stroke(arc(c, c, r - 6, 0, 360 * FR), 'var(--ink)', 10)}<circle cx="${c}" cy="${c}" r="80" fill="none" stroke="var(--hairline)"/>${art('pizza', 70, c - 35, 52)}</g></svg>
      <div class="over" style="justify-content:flex-end;padding-bottom:38px">${num(36)}</div></div>${mrow()}${pies()}${ate()}${addBar()}`; }],
];
const phone = (mode, html, cap) => `<div class="phone" data-theme="${mode}" aria-label="${cap}">${html}</div>`;
document.getElementById('all').innerHTML = V.map(([id, name, desc, f]) => `<section><h2>${id}. ${name}</h2><p>${desc}</p><div class="row">${phone('dark', f(), id + ' koyu')}${phone('light', f(), id + ' açık')}</div></section>`).join('');

const zoom = document.getElementById('zoom');
document.addEventListener('click', e => {
  if (zoom.classList.contains('on')) { zoom.classList.remove('on'); zoom.innerHTML = ''; return; }
  const p = e.target.closest('.phone'); if (p) { zoom.innerHTML = p.outerHTML; zoom.classList.add('on'); }
});
</script>
</body>
</html>
