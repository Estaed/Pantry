<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry yönleri 3</title>
<link rel="stylesheet" href="../../../TarikOS/.brain/skills/tasarim/references/tokens.css">
<link rel="stylesheet" href="../../../TarikOS/.brain/skills/tasarim/assets/fonts/archivo.css">
<style>
  /* Pantry direction test, round 5 (2026-10-20). Kept: V3's meals in the four corners, total kcal
     visible, no week. Two axes, one at a time: A, the shape in the middle of the corners (macro bars
     held at B2); B, the dynamic macro bars after MyNetDiary's (centre held at A1), shown now and after
     dinner so the change is visible. Phones at real size (360x780), shown at 72 %; click to enlarge. */
  @font-face { font-family: Manrope; src: url(../../../TarikOS/.brain/skills/tasarim/assets/fonts/Manrope.woff2) format('woff2'); font-weight: 200 800; }
  * { box-sizing: border-box; }
  body.page { margin: 0; background: #161616; color: #EEEEEE; font: 500 16px/1.5 Manrope, system-ui, sans-serif; }
  .page main { max-width: 1700px; margin: 0 auto; padding: 44px 32px 120px; }
  .page h1 { font: 700 40px/1.05 Archivo, sans-serif; font-stretch: 118%; letter-spacing: -0.8px; margin: 0 0 10px; }
  .page .lede { color: #ABABAB; max-width: 62ch; margin: 0; font-size: 15px; }
  .page .lede b, .page p b { color: #EEEEEE; }
  .page h2 { font: 700 26px/1.15 Archivo, sans-serif; font-stretch: 118%; margin: 60px 0 4px; }
  .page h2 + p { color: #ABABAB; margin: 0 0 8px; font-size: 15px; max-width: 62ch; }
  .page h3 { font: 700 18px/1.2 Archivo, sans-serif; font-stretch: 118%; margin: 28px 0 2px; }
  .page h3 + p { color: #ABABAB; margin: 0 0 12px; font-size: 14px; max-width: 70ch; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; zoom: 0.72; }
  .cap { width: 360px; font: 600 15px Manrope; color: #ABABAB; margin-top: 8px; }

  .phone { background-color: var(--canvas); color: var(--ink); font-family: var(--font-sans); width: 360px; height: 780px; border-radius: 32px; overflow: hidden; border: 1px solid #3A3A3A; display: flex; flex-direction: column; position: relative; flex: none; cursor: zoom-in; }
  .phone * { font-variant-numeric: tabular-nums; }
  .eyebrow { font: 600 12px/1.3 var(--font-sans); color: var(--ink-muted); }
  .title { font: var(--display-weight) 29px/1.06 var(--font-display); font-stretch: var(--display-stretch); letter-spacing: -0.5px; margin-top: 2px; }
  .disp { font-family: var(--font-display); font-weight: var(--display-weight); font-stretch: var(--display-stretch); }
  .top { padding: 18px 12px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nav { display: flex; }
  .ibtn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); border-radius: var(--r-md); flex: none; }
  .ibtn.box { background: var(--surface-2); width: 48px; height: 48px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .btn { height: 48px; border-radius: var(--r-button); background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px var(--font-sans); border: 0; width: 100%; }
  .btn svg.i { width: 20px; height: 20px; }
  .bottom { margin-top: auto; padding: 0 20px 18px; display: flex; gap: 10px; align-items: center; }
  .acc { color: var(--primary-display); }
  .fig { font: 600 12px var(--font-figure); color: var(--ink-subtle); }

  /* the corners frame: four meals at the corners, a shape in the middle */
  .frame { position: relative; margin: 8px 20px 0; height: 262px; }
  .mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .mid > svg { display: block; overflow: visible; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .num { line-height: 1; letter-spacing: -1.5px; }
  .lbl { font: 600 12px var(--font-sans); color: var(--ink-muted); margin-top: 3px; }
  .tot { font: 600 12px var(--font-figure); color: var(--ink-subtle); margin-top: 6px; }
  .tot b { color: var(--ink); font-weight: 700; }
  .corner { position: absolute; width: 86px; font: 600 12px var(--font-sans); color: var(--ink-muted); }
  .corner.r { text-align: right; }
  .corner b { display: block; font: 700 19px/1.15 var(--font-figure); color: var(--ink); }
  .corner .fs { display: flex; gap: 0; margin-top: 4px; }
  .corner.r .fs { justify-content: flex-end; }
  .corner .fs span { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; border: 2px solid var(--canvas); }
  .corner .fs span + span { margin-left: -8px; }
  .corner .fs svg { width: 24px; height: 24px; }
  .corner .addm { width: 30px; height: 30px; border-radius: 50%; border: 1.5px dashed var(--hairline-strong); display: grid; place-items: center; color: var(--ink-muted); margin-top: 4px; }
  .corner.r .addm { margin-left: auto; }
  .corner .addm svg.i { width: 16px; height: 16px; }

  /* macro bars, four takes */
  .mac { margin: 18px 20px 0; }
  .mh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  /* B1: one row, widths follow each macro's share of today's kcal */
  .b1 { display: flex; gap: 4px; }
  .b1 > div { min-width: 0; transition: flex .4s; }
  .b1 .bar { height: 12px; border-radius: 6px; background: var(--chart-neutral); }
  .b1 .top-dom .bar { background: var(--ink); }
  .b1 .lab { display: flex; flex-direction: column; margin-top: 6px; font: 600 12px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
  .b1 .lab b { color: var(--ink); font: 700 16px var(--font-figure); order: -1; }
  .b1 .g { font: 500 12px var(--font-figure); color: var(--ink-subtle); white-space: nowrap; }
  /* B2: three columns side by side, height = share of kcal, dashed line = target share */
  .b2 { display: flex; gap: 14px; align-items: flex-end; height: 112px; border-bottom: 1.5px solid var(--ink); }
  .b2 > div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; }
  .b2 .col { border-radius: 6px 6px 0 0; background: var(--chart-neutral); position: relative; }
  .b2 .dom .col { background: var(--ink-muted); }
  .b2 .pct { font: 700 15px var(--font-figure); text-align: center; margin-bottom: 4px; }
  .b2 .tgt { position: absolute; left: -4px; right: -4px; border-top: 1.5px dashed var(--ink-subtle); }
  .b2l { display: flex; gap: 14px; margin-top: 6px; }
  .b2l div { flex: 1; text-align: center; font: 600 12px var(--font-sans); color: var(--ink-muted); }
  .b2l div span { display: block; font: 500 12px var(--font-figure); color: var(--ink-subtle); }
  /* B3: stacked rows, the largest share on top; length = grams against target */
  .b3 .r { display: grid; grid-template-columns: 62px 1fr 92px; align-items: center; gap: 10px; padding: 6px 0; }
  .b3 .r + .r { border-top: 1px solid var(--hairline); }
  .b3 .nm { font: 600 14px var(--font-sans); }
  .b3 .nm small { display: block; font: 600 11px var(--font-figure); color: var(--ink-subtle); }
  .b3 .tr { height: 10px; border-radius: 5px; background: var(--surface-3); position: relative; }
  .b3 .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--ink-muted); }
  .b3 .r:first-child .tr i { background: var(--ink); }
  .b3 .tr .over { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
  .b3 .v { text-align: right; font: 700 14px var(--font-figure); } .b3 .v small { color: var(--ink-subtle); font-weight: 600; }
  /* B4: MyNetDiary's three columns, kept: % of kcal on top, grams and over/left under, bar vs target */
  .b4 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .b4 > div { padding: 0 12px; } .b4 > div:first-child { padding-left: 0; } .b4 > div + div { border-left: 1px solid var(--hairline); }
  .b4 .h { display: flex; justify-content: space-between; font: 600 12px var(--font-sans); color: var(--ink-muted); }
  .b4 .h b { font: 700 13px var(--font-figure); color: var(--ink); }
  .b4 .tr { height: 8px; border-radius: 4px; background: var(--surface-3); margin: 6px 0; position: relative; overflow: visible; }
  .b4 .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ink-muted); }
  .b4 .tr i.full { background: var(--ink); }
  .b4 .g { font: 700 15px var(--font-figure); } .b4 .g small { font: 600 12px var(--font-figure); color: var(--ink-subtle); }
  .b4 .s { font: 500 12px var(--font-sans); color: var(--ink-subtle); }
  .b4 .s.ov { color: var(--ink); font-weight: 700; }

  .ate { margin: 18px 20px 0; }
  .fr { display: flex; align-items: center; gap: 12px; min-height: 50px; }
  .fr + .fr { border-top: 1px solid var(--hairline); }
  .fr .food { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .fr .food svg { width: 32px; height: 32px; }
  .fr .t { flex: 1; min-width: 0; font: 600 14px/1.3 var(--font-sans); }
  .fr .t span { display: block; font: 500 12px var(--font-figure); color: var(--ink-muted); }
  .fr .k { font: 700 14px var(--font-figure); }
  .page :focus-visible, .phone :focus-visible { outline: 2px solid var(--primary, #FF5A00); outline-offset: 2px; }
  #zoom { position: fixed; inset: 0; background: #000000D9; display: none; place-items: center; z-index: 9; cursor: zoom-out; }
  #zoom.on { display: grid; }
  #zoom > * { zoom: 1.1; }
</style>
</head>
<body class="page">
<main>
  <h1>Pantry, köşeler</h1>
  <p class="lede">Sabit kalanlar: öğünler dört köşede (her köşede o öğünün yemekleri, boşsa ekleme düğmesi), ortada kalan kalori, altında <b>toplam: yenen ve bütçe</b>. Haftalık gösterge yok; altta bugün yediklerin. İki soru var, sırayla: <b>A</b> ortadaki şekil, <b>B</b> makro barları. Cevap biçimi: <b>"A? B?"</b></p>
  <div id="all"></div>
</main>
<div id="zoom"></div>
<script>
const P = {
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M8 7v10M12 7v10M16 7v10"/>',
  plus: '<path d="M5 12h14M12 5v14"/>' };
const ic = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const n = v => Math.round(v).toLocaleString('tr-TR');

// Style C food drawings, 48x48: [kind, d, colour].
const F = {
  chicken: [['f', 'M9 31c-2-8 5-17 16-18 8-1 14 3 14 9 0 8-9 14-19 15-6 0-10-2-11-6z', '#F2B2A2'], ['l', 'M15 28c5-4 11-6 18-6M17 33c4-2 9-3 13-3', '#D98875']],
  tzatziki: [['f', 'M6 25h36c0 9-8 15-18 15S6 34 6 25z', '#4F86B8'], ['f', 'M9 25c2-6 8-9 15-9s13 3 15 9z', '#F4F1E8'], ['f', 'M17 20.5a1.6 1.6 0 1 0 0.1 0zM25 18.5a1.6 1.6 0 1 0 0.1 0zM31 21a1.6 1.6 0 1 0 0.1 0z', '#6E9E4A']],
  pizza: [['f', 'M11 19c8-4 18-4 26 0L24 42z', '#F2C65A'], ['f', 'M8 14c10-5 22-5 32 0l-3 5c-8-4-18-4-26 0z', '#D49A4C'], ['f', 'M20 22.5a2.6 2.6 0 1 0 0.1 0zM28.5 22a2.4 2.4 0 1 0 0.1 0zM24 29.5a2.4 2.4 0 1 0 0.1 0z', '#C84A31']],
};
const art = (k, s = 48, x = 0, y = 0) => `<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true">${F[k].map(([t, d, c]) => t === 'l' ? `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round"/>` : `<path d="${d}" fill="${c}"/>`).join('')}</svg>`;

const T = { kcal: 2200, c: 248, p: 110, f: 86, share: { p: 20, c: 45, f: 35 } };
// Two real states of 20 Oct: now (pizza at breakfast), and after logging dinner (+ chicken 350 g, tzatziki 125 g).
const NOW = { kcal: 1304, p: 66.8, c: 143.2, f: 47.6, meals: [1304, 0, 0, 0], foods: [['pizza'], [], [], []],
  ate: [['pizza', 'Margherita pizza', 'Kahvaltı, 500 g', 1304]] };
const AFTER = { kcal: 1795, p: 144, c: 158.2, f: 62.2, meals: [1304, 0, 491, 0], foods: [['pizza'], [], ['chicken', 'tzatziki'], []],
  ate: [['pizza', 'Margherita pizza', 'Kahvaltı, 500 g', 1304], ['chicken', 'Chicken breast raw', 'Akşam, 350 g', 378], ['tzatziki', 'Tzatziki dip', 'Akşam, 125 g', 113]] };
const MEALS = ['Kahvaltı', 'Öğle', 'Akşam', 'Ara öğün'];
const share = D => { const k = { p: D.p * 4, c: D.c * 4, f: D.f * 9 }, s = k.p + k.c + k.f; return { p: k.p / s * 100, c: k.c / s * 100, f: k.f / s * 100 }; };
const MACS = [['p', 'Protein'], ['c', 'Karb'], ['f', 'Yağ']];

const pt = (cx, cy, r, a) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
const f1 = v => v.toFixed(1);
const arc = (cx, cy, r, a0, a1) => { const [x0, y0] = pt(cx, cy, r, a0), [x1, y1] = pt(cx, cy, r, a1); return `M${f1(x0)} ${f1(y0)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f1(x1)} ${f1(y1)}`; };
const stroke = (d, col, w, cap = 'round') => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="${cap}"/>`;
const head = () => `<div class="top"><div><div class="eyebrow">Salı, 20 Ekim</div><div class="title">Bugün</div></div><div class="nav"><span class="ibtn">${ic('left')}</span><span class="ibtn">${ic('right')}</span></div></div>`;
const addBar = () => `<div class="bottom"><button class="btn">${ic('plus')}Akşama ekle</button><span class="ibtn box">${ic('scan')}</span></div>`;
const centerText = (D, size = 44) => `<span class="num disp acc" style="font-size:${size}px">${n(T.kcal - D.kcal)}</span><span class="lbl">kcal kaldı</span><span class="tot"><b>${n(D.kcal)}</b> / ${n(T.kcal)}</span>`;

function corners(D) {
  const pos = ['left:0;top:0', 'right:0;top:0', 'left:0;bottom:0', 'right:0;bottom:0'];
  return MEALS.map((m, i) => { const r = i % 2 ? ' r' : '';
    const body = D.meals[i] ? `<b>${n(D.meals[i])}</b><div class="fs">${D.foods[i].map(k => `<span>${art(k)}</span>`).join('')}</div>` : `<div class="addm" aria-label="${m} ekle">${ic('plus')}</div>`;
    return `<div class="corner${r}" style="${pos[i]}">${m}${body}</div>`; }).join('');
}

// A: the shape in the middle
const A = [
  ['A1', 'Öğün halkası', 'V3\'teki gibi: halka öğün öğün dolar, her öğün bir parça.', D => { const c = 100, r = 88; let a = 0;
    const segs = D.meals.map(v => { const s = a, e = a + v / T.kcal * 360; a = e; return v ? stroke(arc(c, c, r, s + 2, e - 2), 'var(--ink)', 14) : ''; }).join('');
    return `<svg width="200" height="200" viewBox="0 0 200 200">${stroke(arc(c, c, r, 0, 359.9), 'var(--surface-3)', 14)}${segs}</svg><div class="center">${centerText(D)}</div>`; }],
  ['A2', 'Makro halkası', 'V8: halkanın dolu kısmı protein, karb, yağ payına bölünür.', D => { const c = 100, r = 88, k = [D.p * 4, D.c * 4, D.f * 9], cols = ['var(--ink)', 'var(--ink-muted)', 'var(--chart-neutral)']; let a = 0;
    const segs = k.map((v, i) => { const s = a, e = a + v / T.kcal * 360; a = e; return stroke(arc(c, c, r, s + 1, e - 1), cols[i], 14, 'butt'); }).join('');
    return `<svg width="200" height="200" viewBox="0 0 200 200">${stroke(arc(c, c, r, 0, 359.9), 'var(--surface-3)', 14, 'butt')}${segs}</svg><div class="center">${centerText(D)}</div>`; }],
  ['A3', 'Dört çeyrek', 'Halka dört çeyrek, her çeyrek kendi köşesine bakar ve o öğünle dolar; kahvaltı payını aşmışsa dışına ince bir çizgi taşar.', D => { const c = 100, r = 86, q = [[-90, 0], [0, 90], [180, 270], [90, 180]], fair = T.kcal / 4;
    const parts = q.map(([s, e], i) => { const f = Math.min(1, D.meals[i] / fair), cs = [-90, 0, 270, 90][i], sign = i === 2 ? -1 : 1;
      const base = stroke(arc(c, c, r, s + 4, e - 4), 'var(--surface-3)', 14);
      const fill = D.meals[i] ? stroke(i === 2 ? arc(c, c, r, e - 4 - (e - s - 8) * f, e - 4) : arc(c, c, r, s + 4, s + 4 + (e - s - 8) * f), 'var(--ink)', 14) : '';
      const over = D.meals[i] > fair ? stroke(arc(c, c, r + 13, s + 4, s + 4 + (e - s - 8) * Math.min(1, D.meals[i] / fair - 1)), 'var(--ink-muted)', 3) : '';
      return base + fill + over; }).join('');
    return `<svg width="200" height="200" viewBox="0 0 200 200">${parts}</svg><div class="center">${centerText(D)}</div>`; }],
  ['A4', 'Tabak', 'Ortada bir tabak: kenarı dolar, bugün yediklerin tabağın üstünde durur.', D => { const c = 100, r = 92;
    const on = D.ate.map(([k], i) => { const [x, y] = pt(c, c, 50, [-55, 0, 55][i] ?? 0); return `<circle cx="${f1(x)}" cy="${f1(y)}" r="20" fill="var(--surface-2)"/>${art(k, 32, x - 16, y - 16)}`; }).join('');
    return `<svg width="200" height="200" viewBox="0 0 200 200"><circle cx="${c}" cy="${c}" r="${r + 6}" fill="var(--surface-1)" stroke="var(--hairline)"/>${stroke(arc(c, c, r - 4, 0, 359.9), 'var(--surface-3)', 8)}${stroke(arc(c, c, r - 4, 0, 360 * D.kcal / T.kcal), 'var(--ink)', 8)}${on}</svg>
      <div class="center" style="justify-content:flex-end;padding-bottom:34px">${centerText(D, 34)}</div>`; }],
  ['A5', 'İnce çizgi, büyük sayı', 'Şekil geri çekilir: incecik bir halka, ortada kocaman sayı.', D => { const c = 100, r = 94;
    return `<svg width="200" height="200" viewBox="0 0 200 200">${stroke(arc(c, c, r, 0, 359.9), 'var(--surface-3)', 3)}${stroke(arc(c, c, r, 0, 360 * D.kcal / T.kcal), 'var(--ink)', 3)}<circle cx="${f1(pt(c, c, r, 360 * D.kcal / T.kcal)[0])}" cy="${f1(pt(c, c, r, 360 * D.kcal / T.kcal)[1])}" r="6" fill="var(--chart-1)"/></svg><div class="center">${centerText(D, 66)}</div>`; }],
];

// B: the macro bars
const B = [
  ['B1', 'Pay şeridi', 'Üç bar yan yana tek sırada; genişliği o makronun bugünkü kalori payı. Hangisi fazlaysa o genişler ve koyulaşır; altında yüzde ve gram.', D => { const s = share(D), dom = MACS.reduce((a, [k]) => s[k] > s[a] ? k : a, 'p');
    return `<div class="mac"><div class="mh"><span class="eyebrow">Kalorinin kaynağı</span><span class="fig">hedef %20 / %45 / %35</span></div><div class="b1">${MACS.map(([k, l]) => `<div class="${k === dom ? 'top-dom' : ''}" style="flex:${s[k]}"><div class="bar"></div><div class="lab">${l}<b>%${Math.round(s[k])}</b></div><div class="g">${n(D[k])} / ${n(T[k])} g</div></div>`).join('')}</div></div>`; }],
  ['B2', 'Yükselen sütunlar', 'Üç sütun yan yana; boyu kalori payı, kesikli çizgi hedef payı. Hangisi fazlaysa o yükselir ve koyulaşır.', D => { const s = share(D), dom = MACS.reduce((a, [k]) => s[k] > s[a] ? k : a, 'p'), h = 104, max = 60;
    return `<div class="mac"><div class="mh"><span class="eyebrow">Kalorinin kaynağı</span><span class="fig">kesikli: hedef</span></div><div class="b2">${MACS.map(([k]) => `<div class="${k === dom ? 'dom' : ''}"><span class="pct">%${Math.round(s[k])}</span><div class="col" style="height:${s[k] / max * (h - 22)}px"></div><span class="tgt" style="bottom:${T.share[k] / max * (h - 22)}px"></span></div>`).join('')}</div>
      <div class="b2l">${MACS.map(([k, l]) => `<div>${l}<span>${n(D[k])} / ${n(T[k])} g</span></div>`).join('')}</div></div>`; }],
  ['B3', 'Sıralı satırlar', 'Üç satır, en fazla olan en üstte; sıra gün içinde kendiliğinden değişir. Bar gram hedefine göre dolar, hedefi geçince işaret çıkar.', D => { const s = share(D), ord = [...MACS].sort((a, b) => s[b[0]] - s[a[0]]);
    return `<div class="mac"><div class="mh"><span class="eyebrow">Makrolar, en fazla olan üstte</span></div><div class="b3">${ord.map(([k, l]) => { const f = D[k] / T[k]; return `<div class="r"><span class="nm">${l}<small>%${Math.round(s[k])} kalori</small></span><span class="tr"><i style="width:${Math.min(100, f * 100)}%"></i>${f > 1 ? `<span class="over" style="left:calc(${100 / f}% - 1px)"></span>` : ''}</span><span class="v">${n(D[k])}<small> / ${n(T[k])} g</small></span></div>`; }).join('')}</div></div>`; }],
  ['B4', 'MyNetDiary gibi, sade', 'Orijinaldeki üç sütun: üstte kalori yüzdesi, bar grama göre, altında kalan ya da fazla. Hedefi geçen bar koyulaşır ve "fazla" der.', D => { const s = share(D);
    return `<div class="mac"><div class="b4">${MACS.map(([k, l]) => { const f = D[k] / T[k], d = D[k] - T[k]; return `<div><div class="h">${l}<b>%${Math.round(s[k])}</b></div><div class="tr"><i class="${f >= 1 ? 'full' : ''}" style="width:${Math.min(100, f * 100)}%"></i></div><div class="g">${n(D[k])}<small> g</small></div><div class="s ${d > 0 ? 'ov' : ''}">${d > 0 ? `${n(d)} g fazla` : `${n(-d)} g kaldı`}</div></div>`; }).join('')}</div></div>`; }],
];

const screen = (D, a, b) => `${head()}<div class="frame"><div class="mid" style="width:200px;height:200px">${a(D)}</div>${corners(D)}</div>${b(D)}
  <div class="ate"><div class="eyebrow">Bugün yediklerin</div>${D.ate.slice(-2).map(([k, t, s, kc]) => `<div class="fr"><span class="food">${art(k)}</span><span class="t">${t}<span>${s}</span></span><span class="k">${n(kc)}</span></div>`).join('')}</div>${addBar()}`;
const phone = (mode, html, cap) => `<div><div class="phone" data-theme="${mode}" aria-label="${cap}">${html}</div><div class="cap">${cap}</div></div>`;
const b2 = B[1][3], a1 = A[0][3];
let out = `<h2>A. Ortadaki şekil</h2><p>Makro barları B2'de sabit. Her şekil şimdi (koyu, açık) ve akşamdan sonra (koyu).</p>`;
out += A.map(([id, name, desc, f]) => `<h3>${id}. ${name}</h3><p>${desc}</p><div class="row">${phone('dark', screen(NOW, f, b2), 'Şimdi, koyu')}${phone('light', screen(NOW, f, b2), 'Şimdi, açık')}${phone('dark', screen(AFTER, f, b2), 'Akşamdan sonra, koyu')}</div>`).join('');
out += `<h2>B. Makro barları</h2><p>Ortadaki şekil A1'de sabit. Dinamik olduğu görülsün diye her biri şimdi ve akşam tavuk ile tzatziki girildikten sonra.</p>`;
out += B.map(([id, name, desc, f]) => `<h3>${id}. ${name}</h3><p>${desc}</p><div class="row">${phone('dark', screen(NOW, a1, f), 'Şimdi, koyu')}${phone('dark', screen(AFTER, a1, f), 'Akşamdan sonra, koyu')}${phone('light', screen(AFTER, a1, f), 'Akşamdan sonra, açık')}</div>`).join('');
document.getElementById('all').innerHTML = out;

const zoom = document.getElementById('zoom');
document.addEventListener('click', e => {
  if (zoom.classList.contains('on')) { zoom.classList.remove('on'); zoom.innerHTML = ''; return; }
  const p = e.target.closest('.phone'); if (p) { zoom.innerHTML = p.outerHTML; zoom.classList.add('on'); }
});
</script>
</body>
</html>
