<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry günler</title>
<link rel="stylesheet" href="../../../TarikOS/.brain/skills/tasarim/references/tokens.css">
<link rel="stylesheet" href="../../../TarikOS/.brain/skills/tasarim/assets/fonts/archivo.css">
<style>
  /* Pantry round 6 (2026-10-20). The main screen as picked (A3 with meals running into each other's
     quarter, B1 macro strip), then five ways to see past days' overage and jump to a day. Real data,
     14 Sep to 20 Oct 2026. Phones at real size (360x780), shown at 72 %; click to enlarge. */
  @font-face { font-family: Manrope; src: url(../../../TarikOS/.brain/skills/tasarim/assets/fonts/Manrope.woff2) format('woff2'); font-weight: 200 800; }
  * { box-sizing: border-box; }
  body.page { margin: 0; background: #161616; color: #EEEEEE; font: 500 16px/1.5 Manrope, system-ui, sans-serif; }
  .page main { max-width: 1700px; margin: 0 auto; padding: 44px 32px 120px; }
  .page h1 { font: 700 40px/1.05 Archivo, sans-serif; font-stretch: 118%; letter-spacing: -0.8px; margin: 0 0 10px; }
  .page .lede { color: #ABABAB; max-width: 62ch; margin: 0; font-size: 15px; }
  .page .lede b, .page p b { color: #EEEEEE; }
  .page h2 { font: 700 26px/1.15 Archivo, sans-serif; font-stretch: 118%; margin: 60px 0 4px; }
  .page h2 + p { color: #ABABAB; margin: 0 0 8px; font-size: 15px; max-width: 62ch; }
  .page h3 { font: 700 18px/1.2 Archivo, sans-serif; font-stretch: 118%; margin: 28px 0 2px; }
  .page h3 + p { color: #ABABAB; margin: 0 0 12px; font-size: 14px; max-width: 70ch; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; zoom: 0.72; }
  .cap { width: 360px; font: 600 15px Manrope; color: #ABABAB; margin-top: 8px; }

  .phone { background-color: var(--canvas); color: var(--ink); font-family: var(--font-sans); width: 360px; height: 780px; border-radius: 32px; overflow: hidden; border: 1px solid #3A3A3A; display: flex; flex-direction: column; position: relative; flex: none; cursor: zoom-in; }
  .phone * { font-variant-numeric: tabular-nums; }
  .eyebrow { font: 600 12px/1.3 var(--font-sans); color: var(--ink-muted); }
  .title { font: var(--display-weight) 29px/1.06 var(--font-display); font-stretch: var(--display-stretch); letter-spacing: -0.5px; margin-top: 2px; }
  .title svg.i { width: 18px; height: 18px; vertical-align: 3px; margin-left: 4px; color: var(--ink-muted); }
  .disp { font-family: var(--font-display); font-weight: var(--display-weight); font-stretch: var(--display-stretch); }
  .top { padding: 18px 12px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nav { display: flex; }
  .ibtn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); border-radius: var(--r-md); flex: none; }
  .ibtn.box { background: var(--surface-2); width: 48px; height: 48px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .btn { height: 48px; border-radius: var(--r-button); background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px var(--font-sans); border: 0; width: 100%; }
  .btn svg.i { width: 20px; height: 20px; }
  .bottom { margin-top: auto; padding: 0 20px 18px; display: flex; gap: 10px; align-items: center; }
  .acc { color: var(--primary-display); }
  .fig { font: 600 12px var(--font-figure); color: var(--ink-subtle); }

  /* main: corners + spill ring */
  .frame { position: relative; margin: 6px 20px 0; height: 250px; }
  .mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 196px; height: 196px; }
  .mid > svg { display: block; overflow: visible; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .num { line-height: 1; letter-spacing: -1.5px; }
  .lbl { font: 600 12px var(--font-sans); color: var(--ink-muted); margin-top: 3px; }
  .tot { font: 600 12px var(--font-figure); color: var(--ink-subtle); margin-top: 6px; } .tot b { color: var(--ink); font-weight: 700; }
  .corner { position: absolute; width: 86px; font: 600 12px var(--font-sans); color: var(--ink-muted); }
  .corner.r { text-align: right; }
  .corner .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
  .corner.r .sw { margin: 0 0 0 5px; }
  .corner b { display: block; font: 700 19px/1.15 var(--font-figure); color: var(--ink); }
  .corner .fs { display: flex; margin-top: 4px; } .corner.r .fs { justify-content: flex-end; }
  .corner .fs span { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; border: 2px solid var(--canvas); }
  .corner .fs span + span { margin-left: -8px; }
  .corner .fs svg { width: 24px; height: 24px; }
  .corner .addm { width: 30px; height: 30px; border-radius: 50%; border: 1.5px dashed var(--hairline-strong); display: grid; place-items: center; color: var(--ink-muted); margin-top: 4px; }
  .corner.r .addm { margin-left: auto; } .corner .addm svg.i { width: 16px; height: 16px; }

  .mac { margin: 14px 20px 0; }
  .mh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .b1 { display: flex; gap: 4px; }
  .b1 > div { min-width: 0; }
  .b1 .bar { height: 12px; border-radius: 6px; background: var(--chart-neutral); }
  .b1 .dom .bar { background: var(--ink); }
  .b1 .lab { display: flex; flex-direction: column; margin-top: 6px; font: 600 12px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
  .b1 .lab b { order: -1; color: var(--ink); font: 700 16px var(--font-figure); }
  .b1 .g { font: 500 12px var(--font-figure); color: var(--ink-subtle); white-space: nowrap; }

  .ate { margin: 14px 20px 0; }
  .fr { display: flex; align-items: center; gap: 12px; min-height: 48px; }
  .fr + .fr { border-top: 1px solid var(--hairline); }
  .fr .food { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .fr .food svg { width: 30px; height: 30px; }
  .fr .t { flex: 1; min-width: 0; font: 600 14px/1.3 var(--font-sans); }
  .fr .t span { display: block; font: 500 12px var(--font-figure); color: var(--ink-muted); }
  .fr .k { font: 700 14px var(--font-figure); }

  /* W1: week strip under the title, a small ring per day */
  .w1 { display: flex; justify-content: space-between; padding: 10px 14px 0; }
  .w1 > div { width: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 7px; border-radius: 12px; font: 600 11px var(--font-sans); color: var(--ink-subtle); position: relative; }
  .w1 > div b { font: 700 14px var(--font-figure); color: var(--ink); }
  .w1 > div svg { width: 24px; height: 24px; margin-top: 3px; }
  .w1 > div.on { background: var(--action); color: var(--on-action); } .w1 > div.on b { color: var(--on-action); }
  /* W2: compact bars above the button, the part over budget drawn darker */
  .w2 { margin: 0 20px 10px; }
  .w2 .bars { display: flex; gap: 6px; align-items: flex-end; height: 46px; position: relative; }
  .w2 .bars .bud { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ink-subtle); z-index: 1; }
  .w2 .bars > div { flex: 1; display: flex; flex-direction: column-reverse; border-radius: 4px; overflow: hidden; position: relative; }
  .w2 .bars i { display: block; background: var(--chart-neutral); }
  .w2 .bars i.ov { background: var(--ink); }
  .w2 .bars i.k { background: var(--chart-1); }
  .w2 .bars > div.on { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--primary); }
  .w2 .lab { display: flex; gap: 6px; margin-top: 5px; } .w2 .lab span { flex: 1; text-align: center; font: 600 11px var(--font-sans); color: var(--ink-subtle); } .w2 .lab span.on { color: var(--ink); font-weight: 700; }
  /* W3: date strip with the difference to budget under each day */
  .w3 { display: flex; gap: 4px; padding: 10px 14px 0; overflow: hidden; }
  .w3 > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 6px 0 8px; border-radius: 12px; font: 600 11px var(--font-sans); color: var(--ink-subtle); }
  .w3 > div b { font: 700 15px var(--font-figure); color: var(--ink); }
  .w3 > div em { font: 700 11px var(--font-figure); font-style: normal; margin-top: 2px; color: var(--ink-subtle); }
  .w3 > div em.ov { color: var(--ink); }
  .w3 > div em.ov::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); margin-right: 3px; vertical-align: 1px; }
  .w3 > div.on { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--ink); }
  /* W4: the ring itself swipes; neighbours peek in at the edges */
  .peek { position: absolute; top: 50%; transform: translateY(-50%); width: 120px; height: 120px; opacity: .55; }
  .peek .center { font: 700 13px var(--font-figure); }
  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 4px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-3); }
  .dots i.ov { background: var(--ink-muted); }
  .dots i.on { width: 22px; border-radius: 4px; background: var(--ink); }
  /* W5: month sheet from the title */
  .scrim { position: absolute; inset: 0; background: var(--scrim); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface-1); border-top: 1px solid var(--hairline-strong); border-radius: 28px 28px 0 0; padding: 10px 18px 20px; box-shadow: var(--shadow-3); }
  .sheet .handle { width: 36px; height: 4px; border-radius: 4px; background: var(--hairline-strong); margin: 0 auto 12px; }
  .sheet .sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .sheet .sh .title { font-size: 22px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 2px; text-align: center; }
  .cal .dl { font: 600 11px var(--font-sans); color: var(--ink-subtle); }
  .cal .d { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0; border-radius: 10px; font: 700 12px var(--font-figure); }
  .cal .d svg { width: 26px; height: 26px; }
  .cal .d.on { background: var(--action); color: var(--on-action); }
  .cal .d.fut { color: var(--ink-subtle); }
  .legend { display: flex; gap: 16px; margin-top: 12px; font: 500 12px var(--font-sans); color: var(--ink-muted); align-items: center; }
  .legend svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
  .page :focus-visible, .phone :focus-visible { outline: 2px solid var(--primary, #FF5A00); outline-offset: 2px; }
  #zoom { position: fixed; inset: 0; background: #000000D9; display: none; place-items: center; z-index: 9; cursor: zoom-out; }
  #zoom.on { display: grid; }
  #zoom > * { zoom: 1.1; }
</style>
</head>
<body class="page">
<main>
  <h1>Pantry, günler</h1>
  <p class="lede">Önce seçtiğin ana ekran: <b>A3, öğünler birbirinin çeyreğine taşıyor</b> (her öğün kendi tonunda), makrolar <b>B1</b>. Sonra 7 günlük kısmın beş hali: önceki günlerin aşımını göstersin, dokununca ya da kaydırınca o güne gitsin. Cevap biçimi: <b>"W?"</b></p>
  <div id="all"></div>
</main>
<div id="zoom"></div>
<script>
const P = {
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>', down: '<path d="m6 9 6 6 6-6"/>',
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M8 7v10M12 7v10M16 7v10"/>',
  plus: '<path d="M5 12h14M12 5v14"/>' };
const ic = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const n = v => Math.round(v).toLocaleString('tr-TR');
const sg = v => (v > 0 ? '+' : '−') + n(Math.abs(v));

const F = {
  chicken: [['f', 'M9 31c-2-8 5-17 16-18 8-1 14 3 14 9 0 8-9 14-19 15-6 0-10-2-11-6z', '#F2B2A2'], ['l', 'M15 28c5-4 11-6 18-6M17 33c4-2 9-3 13-3', '#D98875']],
  tzatziki: [['f', 'M6 25h36c0 9-8 15-18 15S6 34 6 25z', '#4F86B8'], ['f', 'M9 25c2-6 8-9 15-9s13 3 15 9z', '#F4F1E8'], ['f', 'M17 20.5a1.6 1.6 0 1 0 0.1 0zM25 18.5a1.6 1.6 0 1 0 0.1 0zM31 21a1.6 1.6 0 1 0 0.1 0z', '#6E9E4A']],
  pizza: [['f', 'M11 19c8-4 18-4 26 0L24 42z', '#F2C65A'], ['f', 'M8 14c10-5 22-5 32 0l-3 5c-8-4-18-4-26 0z', '#D49A4C'], ['f', 'M20 22.5a2.6 2.6 0 1 0 0.1 0zM28.5 22a2.4 2.4 0 1 0 0.1 0zM24 29.5a2.4 2.4 0 1 0 0.1 0z', '#C84A31']],
};
const art = (k, s = 48, x = 0, y = 0) => `<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true">${F[k].map(([t, d, c]) => t === 'l' ? `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round"/>` : `<path d="${d}" fill="${c}"/>`).join('')}</svg>`;

const T = { kcal: 2200, c: 248, p: 110, f: 86 };
// Real daily totals, 14 Sep to 20 Oct 2026 (20 Oct still in progress).
const HIST = [['2026-09-14', 2217], ['2026-09-15', 2228], ['2026-09-16', 2060], ['2026-09-17', 2385], ['2026-09-18', 2217], ['2026-09-19', 2391], ['2026-09-20', 3934], ['2026-09-21', 2147], ['2026-09-22', 2022], ['2026-09-23', 2317], ['2026-09-24', 2090], ['2026-09-25', 2096], ['2026-09-26', 2155], ['2026-09-27', 2101], ['2026-09-28', 2149], ['2026-09-29', 2322], ['2026-09-30', 2022], ['2026-10-01', 2317], ['2026-10-02', 2217], ['2026-10-03', 2429], ['2026-10-04', 2317], ['2026-10-05', 2317], ['2026-10-06', 1901], ['2026-10-07', 1901], ['2026-10-08', 2217], ['2026-10-09', 2540], ['2026-10-10', 2540], ['2026-10-11', 2134], ['2026-10-12', 2057], ['2026-10-13', 2508], ['2026-10-14', 2292], ['2026-10-15', 2149], ['2026-10-16', 2217], ['2026-10-17', 2292], ['2026-10-18', 2568], ['2026-10-19', 2292], ['2026-10-20', 1304]];
const DN = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const day = s => new Date(s + 'T00:00:00Z');
const WEEK = HIST.slice(-7);

const NOW = { kcal: 1304, p: 66.8, c: 143.2, f: 47.6, meals: [1304, 0, 0, 0], foods: [['pizza'], [], [], []], ate: [['pizza', 'Margherita pizza', 'Kahvaltı, 500 g', 1304]] };
const AFTER = { kcal: 1795, p: 144, c: 158.2, f: 62.2, meals: [1304, 0, 491, 0], foods: [['pizza'], [], ['chicken', 'tzatziki'], []],
  ate: [['chicken', 'Chicken breast raw', 'Akşam, 350 g', 378], ['tzatziki', 'Tzatziki dip', 'Akşam, 125 g', 113]] };
// Clockwise from 9 o'clock: breakfast top-left, lunch top-right, dinner bottom-right, snacks bottom-left.
const MEALS = ['Kahvaltı', 'Öğle', 'Akşam', 'Ara öğün'];
const QS = [-90, 0, 90, 180];
const TONE = ['var(--ink)', 'var(--ink-muted)', 'var(--chart-neutral)', 'var(--hairline-strong)'];
const MACS = [['p', 'Protein'], ['c', 'Karb'], ['f', 'Yağ']];
const share = D => { const k = { p: D.p * 4, c: D.c * 4, f: D.f * 9 }, s = k.p + k.c + k.f; return { p: k.p / s * 100, c: k.c / s * 100, f: k.f / s * 100 }; };

const pt = (cx, cy, r, a) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
const f1 = v => v.toFixed(1);
const arc = (cx, cy, r, a0, a1) => { if (a1 - a0 >= 359) return arc(cx, cy, r, a0, a0 + 180) + arc(cx, cy, r, a0 + 180, a1).replace('M', ' M'); const [x0, y0] = pt(cx, cy, r, a0), [x1, y1] = pt(cx, cy, r, a1); return `M${f1(x0)} ${f1(y0)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f1(x1)} ${f1(y1)}`; };
const stroke = (d, col, w, cap = 'round') => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="${cap}"/>`;

// The picked ring: four quarter tracks; each meal starts in its own quarter (or where the one before ended) and runs on.
function spill(D, size = 196, w = 14) {
  const c = size / 2, r = c - w / 2 - 2;
  const tracks = QS.map(s => stroke(arc(c, c, r, s + 3, s + 87), 'var(--surface-3)', w, 'butt')).join('');
  let end = -999;
  const segs = D.meals.map((v, i) => { if (!v) return ''; const s = Math.max(QS[i], end), e = s + v / T.kcal * 360; end = e; return stroke(arc(c, c, r, s + 1.5, e - 1.5), TONE[i], w, 'butt'); }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${tracks}${segs}</svg>`;
}
const mini = (v, s = 24, w = 4) => { const c = s / 2, r = c - w / 2 - 0.5, f = Math.min(1, v / T.kcal), ov = v > T.kcal;
  return `<svg viewBox="0 0 ${s} ${s}" aria-hidden="true">${stroke(arc(c, c, r, 0, 359.9), 'var(--surface-3)', w)}${stroke(arc(c, c, r, 0, 360 * f - (f >= 1 ? 0.1 : 0)), ov ? 'var(--ink)' : 'var(--ink-muted)', w)}${ov ? `<circle cx="${c}" cy="${c}" r="${r - w}" fill="var(--ink)"/>` : ''}</svg>`; };

const head = (chev = false, nav = true) => `<div class="top"><div><div class="eyebrow">Salı, 20 Ekim</div><div class="title">Bugün${chev ? ic('down') : ''}</div></div>${nav ? `<div class="nav"><span class="ibtn">${ic('left')}</span><span class="ibtn">${ic('right')}</span></div>` : ''}</div>`;
const addBar = () => `<div class="bottom"><button class="btn">${ic('plus')}Akşama ekle</button><span class="ibtn box">${ic('scan')}</span></div>`;
function corners(D) {
  const pos = ['left:0;top:0', 'right:0;top:0', 'right:0;bottom:0', 'left:0;bottom:0'];
  return MEALS.map((m, i) => { const r = i === 1 || i === 2 ? ' r' : '', sw = `<i class="sw" style="background:${TONE[i]}"></i>`;
    const body = D.meals[i] ? `<b>${n(D.meals[i])}</b><div class="fs">${D.foods[i].map(k => `<span>${art(k)}</span>`).join('')}</div>` : `<div class="addm">${ic('plus')}</div>`;
    return `<div class="corner${r}" style="${pos[i]}">${r ? m + sw : sw + m}${body}</div>`; }).join('');
}
const frame = (D, extra = '') => `<div class="frame"><div class="mid">${spill(D)}<div class="center"><span class="num disp acc" style="font-size:44px">${n(T.kcal - D.kcal)}</span><span class="lbl">kcal kaldı</span><span class="tot"><b>${n(D.kcal)}</b> / ${n(T.kcal)}</span></div></div>${corners(D)}${extra}</div>`;
const b1 = D => { const s = share(D), dom = MACS.reduce((a, [k]) => s[k] > s[a] ? k : a, 'p');
  return `<div class="mac"><div class="mh"><span class="eyebrow">Kalorinin kaynağı</span><span class="fig">hedef %20 / %45 / %35</span></div><div class="b1">${MACS.map(([k, l]) => `<div class="${k === dom ? 'dom' : ''}" style="flex:${s[k]}"><div class="bar"></div><div class="lab"><b>%${Math.round(s[k])}</b>${l}</div><div class="g">${n(D[k])} / ${n(T[k])} g</div></div>`).join('')}</div></div>`; };
const ate = (D, rows = 2) => `<div class="ate"><div class="eyebrow">Bugün yediklerin</div>${D.ate.slice(0, rows).map(([k, t, s, kc]) => `<div class="fr"><span class="food">${art(k)}</span><span class="t">${t}<span>${s}</span></span><span class="k">${n(kc)}</span></div>`).join('')}</div>`;

// day navigation takes
const w1 = () => `<div class="w1">${WEEK.map(([d, v], i) => `<div class="${i === 6 ? 'on' : ''}">${DN[day(d).getUTCDay()]}<b>${day(d).getUTCDate()}</b>${mini(v)}</div>`).join('')}</div>`;
const w2 = () => { const h = 46, max = 2700; return `<div class="w2"><div class="bars"><div class="bud" style="bottom:${T.kcal / max * h}px"></div>${WEEK.map(([d, v], i) => { const base = Math.min(v, T.kcal), ov = Math.max(0, v - T.kcal);
  return `<div class="${i === 6 ? 'on' : ''}"><i class="${i === 6 ? 'k' : ''}" style="height:${base / max * h}px"></i>${ov ? `<i class="ov" style="height:${ov / max * h}px"></i>` : ''}<title>${d}: ${n(v)} kcal</title></div>`; }).join('')}</div>
  <div class="lab">${WEEK.map(([d], i) => `<span class="${i === 6 ? 'on' : ''}">${DN[day(d).getUTCDay()]}</span>`).join('')}</div></div>`; };
const w3 = () => `<div class="w3">${WEEK.map(([d, v], i) => `<div class="${i === 6 ? 'on' : ''}">${DN[day(d).getUTCDay()]}<b>${day(d).getUTCDate()}</b><em class="${v > T.kcal && i < 6 ? 'ov' : ''}">${i === 6 ? 'bugün' : sg(v - T.kcal)}</em></div>`).join('')}</div>`;
const w4peek = () => `<div class="peek" style="left:-92px"><svg width="120" height="120" viewBox="0 0 120 120">${stroke(arc(60, 60, 52, 0, 359.9), 'var(--ink)', 8)}</svg><div class="center" style="align-items:flex-end;padding-right:16px">+92</div></div>
  <div class="peek" style="right:-92px;opacity:.3"><svg width="120" height="120" viewBox="0 0 120 120">${stroke(arc(60, 60, 52, 0, 359.9), 'var(--surface-3)', 8)}</svg></div>`;
const w4dots = () => `<div class="dots">${WEEK.map(([, v], i) => `<i class="${i === 6 ? 'on' : v > T.kcal ? 'ov' : ''}"></i>`).join('')}</div>`;
function w5sheet() {
  const first = day('2026-09-14'), cells = []; // Monday-first grid; 14 Sep 2026 is a Monday
  for (let i = 0; i < 42; i++) { const dt = new Date(first.getTime() + i * 864e5), s = dt.toISOString().slice(0, 10), h = HIST.find(([d]) => d === s);
    if (s > '2026-10-26') break; cells.push([dt.getUTCDate(), h ? h[1] : null, s === '2026-10-20']); }
  return `<div class="scrim"></div><div class="sheet"><div class="handle"></div><div class="sh"><div class="title">Eylül–Ekim</div><div class="nav"><span class="ibtn">${ic('left')}</span><span class="ibtn">${ic('right')}</span></div></div>
    <div class="cal">${['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map(d => `<span class="dl">${d}</span>`).join('')}${cells.map(([dn, v, on]) => `<div class="d ${on ? 'on' : ''} ${v == null ? 'fut' : ''}">${v == null ? `<svg viewBox="0 0 24 24"></svg>` : mini(v, 24, 4)}${dn}</div>`).join('')}</div>
    <div class="legend"><span>${mini(1600, 16, 3)}bütçe içinde</span><span>${mini(2500, 16, 3)}aşıldı</span><span class="fig" style="margin-left:auto">${HIST.filter(([, v]) => v > T.kcal).length} / ${HIST.length - 1} gün aşıldı</span></div></div>`;
}

const main = D => `${head()}${frame(D)}${b1(D)}${ate(D)}${addBar()}`;
const W = [
  ['W1', 'Gün şeridi', 'Başlığın altında haftanın günleri, her günde küçük bir halka. Aşılan gün halkası dolu ve ortası koyu. Dokun, o güne git; yana kaydır, önceki hafta.', D => `${head(false, false)}${w1()}${frame(D)}${b1(D)}${ate(D, 1)}${addBar()}`],
  ['W2', 'Alttaki barlar', 'MyNetDiary\'deki alt şerit, iyileştirilmiş: bütçenin üstündeki kısım koyu bir başlık olarak görünür, aşım bir bakışta okunur. Bara dokun, o güne git.', D => `${head()}${frame(D)}${b1(D)}${ate(D, 1)}<div style="margin-top:auto"></div>${w2()}${addBar().replace('margin-top: auto', '')}`],
  ['W3', 'Fark şeridi', 'Günlerin altında bütçeye göre fark: "+92", "−51". Aşılan gün koyu ve noktalı. Dokun ya da kaydır.', D => `${head(false, false)}${w3()}${frame(D)}${b1(D)}${ate(D, 1)}${addBar()}`],
  ['W4', 'Kaydırılan halka', 'Halkanın kendisi kayar: dünün halkası solda yarım görünür, üstünde aşımı. Altta yedi nokta, aşılan günler koyu.', D => `${head()}${frame(D, w4peek())}${w4dots()}${b1(D)}${ate(D, 1)}${addBar()}`],
  ['W5', 'Ay takvimi', 'Başlığa dokununca ay açılır: her gün küçük bir halka, aşılan günler dolu. Bir güne dokun, oraya git. Ana ekran sade kalır.', D => `${head(true)}${frame(D)}${b1(D)}${ate(D)}${addBar()}${w5sheet()}`],
];
const phone = (mode, html, cap) => `<div><div class="phone" data-theme="${mode}" aria-label="${cap}">${html}</div><div class="cap">${cap}</div></div>`;
let out = `<h2>Seçilen ana ekran</h2><p>Kahvaltı (1.304) kendi çeyreğini doldurup öğlenin çeyreğine, oradan akşamın çeyreğine taşıyor; akşam girilince kahvaltının bittiği yerden devam ediyor. Köşe renkleri halkadaki tonlar.</p><div class="row">${phone('dark', main(NOW), 'Şimdi, koyu')}${phone('light', main(NOW), 'Şimdi, açık')}${phone('dark', main(AFTER), 'Akşamdan sonra, koyu')}${phone('light', main(AFTER), 'Akşamdan sonra, açık')}</div>`;
out += `<h2>Günler</h2><p>Önceki günlerin aşımını görmek ve o güne hızla gitmek için beş yol.</p>`;
out += W.map(([id, name, desc, f]) => `<h3>${id}. ${name}</h3><p>${desc}</p><div class="row">${phone('dark', f(NOW), 'Koyu')}${phone('light', f(NOW), 'Açık')}</div>`).join('');
document.getElementById('all').innerHTML = out;

const zoom = document.getElementById('zoom');
document.addEventListener('click', e => {
  if (zoom.classList.contains('on')) { zoom.classList.remove('on'); zoom.innerHTML = ''; return; }
  const p = e.target.closest('.phone'); if (p) { zoom.innerHTML = p.outerHTML; zoom.classList.add('on'); }
});
</script>
</body>
</html>
