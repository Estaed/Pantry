<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry renkler</title>
<link rel="stylesheet" href="../../../TarikOS/.brain/skills/tasarim/references/tokens.css">
<link rel="stylesheet" href="../../../TarikOS/.brain/skills/tasarim/assets/fonts/archivo.css">
<style>
  /* Pantry round 7 (2026-10-20). The picked screen (A3 spill ring, B1 macro strip, W3 date strip) in
     three colour treatments, because the meal greys read poorly. Tested on the hardest real day,
     8 Aug 2026 (all four meals, protein far over), and on 20 Oct after dinner. Phones at real size
     (360x780), shown at 72 %; click to enlarge. */
  @font-face { font-family: Manrope; src: url(../../../TarikOS/.brain/skills/tasarim/assets/fonts/Manrope.woff2) format('woff2'); font-weight: 200 800; }
  * { box-sizing: border-box; }
  body.page { margin: 0; background: #161616; color: #EEEEEE; font: 500 16px/1.5 Manrope, system-ui, sans-serif; }
  .page main { max-width: 1700px; margin: 0 auto; padding: 44px 32px 120px; }
  .page h1 { font: 700 40px/1.05 Archivo, sans-serif; font-stretch: 118%; letter-spacing: -0.8px; margin: 0 0 10px; }
  .page .lede { color: #ABABAB; max-width: 62ch; margin: 0; font-size: 15px; }
  .page .lede b, .page p b { color: #EEEEEE; }
  .page h3 { font: 700 20px/1.2 Archivo, sans-serif; font-stretch: 118%; margin: 44px 0 2px; }
  .page h3 + p { color: #ABABAB; margin: 0 0 12px; font-size: 14px; max-width: 70ch; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; zoom: 0.72; }
  .cap { width: 360px; font: 600 15px Manrope; color: #ABABAB; margin-top: 8px; }

  .phone { background-color: var(--canvas); color: var(--ink); font-family: var(--font-sans); width: 360px; height: 780px; border-radius: 32px; overflow: hidden; border: 1px solid #3A3A3A; display: flex; flex-direction: column; position: relative; flex: none; cursor: zoom-in; }
  .phone * { font-variant-numeric: tabular-nums; }
  .eyebrow { font: 600 12px/1.3 var(--font-sans); color: var(--ink-muted); }
  .title { font: var(--display-weight) 29px/1.06 var(--font-display); font-stretch: var(--display-stretch); letter-spacing: -0.5px; margin-top: 2px; }
  .disp { font-family: var(--font-display); font-weight: var(--display-weight); font-stretch: var(--display-stretch); }
  .top { padding: 18px 20px 0; }
  .ibtn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); border-radius: var(--r-md); flex: none; }
  .ibtn.box { background: var(--surface-2); width: 48px; height: 48px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .btn { height: 48px; border-radius: var(--r-button); background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px var(--font-sans); border: 0; width: 100%; }
  .btn svg.i { width: 20px; height: 20px; }
  .bottom { margin-top: auto; padding: 0 20px 18px; display: flex; gap: 10px; align-items: center; }
  .acc { color: var(--primary-display); }
  .fig { font: 600 12px var(--font-figure); color: var(--ink-subtle); }

  .w3 { display: flex; gap: 4px; padding: 10px 14px 0; }
  .w3 > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 6px 0 8px; border-radius: 12px; font: 600 11px var(--font-sans); color: var(--ink-subtle); }
  .w3 > div b { font: 700 15px var(--font-figure); color: var(--ink); }
  .w3 > div em { font: 700 11px var(--font-figure); font-style: normal; margin-top: 2px; color: var(--ink-subtle); }
  .w3 > div em.ov { color: var(--ink); }
  .w3 > div em.ov::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); margin-right: 3px; vertical-align: 1px; }
  .w3 > div.on { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--ink); }

  .frame { position: relative; margin: 6px 20px 0; height: 250px; }
  .mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 196px; height: 196px; }
  .mid > svg { display: block; overflow: visible; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .num { line-height: 1; letter-spacing: -1.5px; }
  .lbl { font: 600 12px var(--font-sans); color: var(--ink-muted); margin-top: 3px; }
  .tot { font: 600 12px var(--font-figure); color: var(--ink-subtle); margin-top: 6px; } .tot b { color: var(--ink); font-weight: 700; }
  .corner { position: absolute; width: 90px; font: 600 12px var(--font-sans); color: var(--ink-muted); }
  .corner.r { text-align: right; }
  .corner .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .corner.r .sw { margin: 0 0 0 5px; }
  .corner b { display: block; font: 700 19px/1.15 var(--font-figure); color: var(--ink); }
  .corner .fs { display: flex; margin-top: 4px; } .corner.r .fs { justify-content: flex-end; }
  .corner .fs span { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; border: 2px solid var(--canvas); }
  .corner .fs span + span { margin-left: -8px; }
  .corner .fs svg { width: 24px; height: 24px; }
  .corner .addm { width: 30px; height: 30px; border-radius: 50%; border: 1.5px dashed var(--hairline-strong); display: grid; place-items: center; color: var(--ink-muted); margin-top: 4px; }
  .corner.r .addm { margin-left: auto; } .corner .addm svg.i { width: 16px; height: 16px; }

  .mac { margin: 14px 20px 0; }
  .mh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .b1 { display: flex; gap: 4px; }
  .b1 > div { min-width: 0; }
  .b1 .bar { height: 12px; border-radius: 6px; }
  .b1 .lab { display: flex; flex-direction: column; margin-top: 6px; font: 600 12px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
  .b1 .lab b { order: -1; color: var(--ink); font: 700 16px var(--font-figure); }
  .b1 .g { font: 500 12px var(--font-figure); color: var(--ink-subtle); white-space: nowrap; }
  /* R3 macro strip: values inside taller bars */
  .b1.in .bar { height: 30px; border-radius: 8px; display: flex; align-items: center; padding: 0 8px; font: 700 13px var(--font-figure); white-space: nowrap; overflow: hidden; }
  .b1.in .lab { margin-top: 4px; }

  .ate { margin: 14px 20px 0; }
  .fr { display: flex; align-items: center; gap: 12px; min-height: 46px; }
  .fr + .fr { border-top: 1px solid var(--hairline); }
  .fr .food { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .fr .food svg { width: 28px; height: 28px; }
  .fr .t { flex: 1; min-width: 0; font: 600 14px/1.3 var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fr .t span { display: block; font: 500 12px var(--font-figure); color: var(--ink-muted); }
  .fr .k { font: 700 14px var(--font-figure); }
  .page :focus-visible, .phone :focus-visible { outline: 2px solid var(--primary, #FF5A00); outline-offset: 2px; }
  #zoom { position: fixed; inset: 0; background: #000000D9; display: none; place-items: center; z-index: 9; cursor: zoom-out; }
  #zoom.on { display: grid; }
  #zoom > * { zoom: 1.1; }
</style>
</head>
<body class="page">
<main>
  <h1>Pantry, renkler</h1>
  <p class="lede">Seçilen ekran (A3 halka, B1 makro şeridi, W3 gün şeridi) üç renk biçiminde. En zor gerçek günde denendi: <b>8 Ağustos</b>, dört öğün de var ve protein hedefin çok üstünde. Yanında 20 Ekim akşamdan sonra. Cevap biçimi: <b>"R?"</b></p>
  <div id="all"></div>
</main>
<div id="zoom"></div>
<script>
const P = {
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M8 7v10M12 7v10M16 7v10"/>',
  plus: '<path d="M5 12h14M12 5v14"/>' };
const ic = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const n = v => Math.round(v).toLocaleString('tr-TR');
const sg = v => (v > 0 ? '+' : '−') + n(Math.abs(v));

const F = {
  chicken: [['f', 'M9 31c-2-8 5-17 16-18 8-1 14 3 14 9 0 8-9 14-19 15-6 0-10-2-11-6z', '#F2B2A2'], ['l', 'M15 28c5-4 11-6 18-6M17 33c4-2 9-3 13-3', '#D98875']],
  grilled: [['f', 'M9 31c-2-8 5-17 16-18 8-1 14 3 14 9 0 8-9 14-19 15-6 0-10-2-11-6z', '#C98A55'], ['l', 'M14 30l16-12M18 34l16-12', '#7A4A26']],
  tzatziki: [['f', 'M6 25h36c0 9-8 15-18 15S6 34 6 25z', '#4F86B8'], ['f', 'M9 25c2-6 8-9 15-9s13 3 15 9z', '#F4F1E8'], ['f', 'M17 20.5a1.6 1.6 0 1 0 0.1 0zM25 18.5a1.6 1.6 0 1 0 0.1 0zM31 21a1.6 1.6 0 1 0 0.1 0z', '#6E9E4A']],
  pizza: [['f', 'M11 19c8-4 18-4 26 0L24 42z', '#F2C65A'], ['f', 'M8 14c10-5 22-5 32 0l-3 5c-8-4-18-4-26 0z', '#D49A4C'], ['f', 'M20 22.5a2.6 2.6 0 1 0 0.1 0zM28.5 22a2.4 2.4 0 1 0 0.1 0zM24 29.5a2.4 2.4 0 1 0 0.1 0z', '#C84A31']],
  potato: [['f', 'M7 27c0-8 8-14 18-14s16 5 16 12-8 12-18 12S7 34 7 27z', '#D6A468'], ['f', 'M16 23.5a1.4 1.4 0 1 0 0.1 0zM28 21a1.4 1.4 0 1 0 0.1 0zM31 30a1.4 1.4 0 1 0 0.1 0zM20 31a1.2 1.2 0 1 0 0.1 0z', '#8A5A2B']],
  sandwich: [['f', 'M7 34L24 11l17 23z', '#E8C38A'], ['f', 'M10 30h28l-2 4H12z', '#8B4A3A'], ['f', 'M9 28h30l-1 2H10z', '#7FAE52']],
  bread: [['f', 'M8 22c0-6 7-9 16-9s16 3 16 9c0 2-2 3-3 3v12H11V25c-1 0-3-1-3-3z', '#C98B4A'], ['f', 'M17 19a1.2 1.2 0 1 0 0.1 0zM24 17a1.2 1.2 0 1 0 0.1 0zM30 20a1.2 1.2 0 1 0 0.1 0zM21 23a1.2 1.2 0 1 0 0.1 0zM28 24a1.2 1.2 0 1 0 0.1 0z', '#5C3D22']],
};
const art = (k, s = 48, x = 0, y = 0) => `<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true">${F[k].map(([t, d, c]) => t === 'l' ? `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round"/>` : `<path d="${d}" fill="${c}"/>`).join('')}</svg>`;

const T = { kcal: 2200, c: 248, p: 110, f: 86 };
const DN = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const MONTH = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const DAYNAME = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const day = s => new Date(s + 'T00:00:00Z');
// Two real days.
const AUG8 = { date: '2026-08-08', kcal: 1976, p: 257.7, c: 185.7, f: 33.8, meals: [888, 350, 590, 148], foods: [['grilled'], ['sandwich'], ['potato'], ['bread']],
  week: [['2026-08-02', 2134], ['2026-08-03', 2177], ['2026-08-04', 1794], ['2026-08-05', 2114], ['2026-08-06', 2458], ['2026-08-07', 2073], ['2026-08-08', 1976]],
  ate: [['grilled', 'Chicken grilled', 'Kahvaltı, 3 parça', 888], ['potato', 'Washed white potato', 'Akşam, 1000 g', 590]], open: false };
const OCT20 = { date: '2026-10-20', kcal: 1795, p: 144, c: 158.2, f: 62.2, meals: [1304, 0, 491, 0], foods: [['pizza'], [], ['chicken', 'tzatziki'], []],
  week: [['2026-10-14', 2292], ['2026-10-15', 2149], ['2026-10-16', 2217], ['2026-10-17', 2292], ['2026-10-18', 2568], ['2026-10-19', 2292], ['2026-10-20', 1795]],
  ate: [['chicken', 'Chicken breast raw', 'Akşam, 350 g', 378], ['tzatziki', 'Tzatziki dip', 'Akşam, 125 g', 113]], open: true };
const MEALS = ['Kahvaltı', 'Öğle', 'Akşam', 'Ara öğün'];
const QS = [-90, 0, 90, 180];
const MACS = [['p', 'Protein'], ['c', 'Karb'], ['f', 'Yağ']];
const share = D => { const k = { p: D.p * 4, c: D.c * 4, f: D.f * 9 }, s = k.p + k.c + k.f; return { p: k.p / s * 100, c: k.c / s * 100, f: k.f / s * 100 }; };

const pt = (cx, cy, r, a) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
const f1 = v => v.toFixed(1);
const arc = (cx, cy, r, a0, a1) => { if (a1 - a0 >= 359) return arc(cx, cy, r, a0, a0 + 180) + arc(cx, cy, r, a0 + 180, a1).replace('M', ' M'); const [x0, y0] = pt(cx, cy, r, a0), [x1, y1] = pt(cx, cy, r, a1); return `M${f1(x0)} ${f1(y0)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f1(x1)} ${f1(y1)}`; };
const stroke = (d, col, w, cap = 'butt', extra = '') => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="${cap}" ${extra}/>`;

// Three colour treatments. Each gives: the meal tones (ring + corner swatch) and how the macro strip is drawn.
const R = {
  R1: { name: 'Renkli öğünler', desc: 'Her öğün tasarım dilimizin grafik paletinden bir renk (renk körlüğüne göre doğrulanmış: mavi, yeşil-mavi, kehribar, mor). Turuncu yine yalnız kalan kalori. Makro şeridi gri kalır, en büyük payı koyu.',
    seg: i => ({ col: ['var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)'][i] }), sw: i => `background:${['var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)'][i]}`,
    mac: (k, dom) => `background:${dom ? 'var(--ink)' : 'var(--chart-neutral)'}`, inside: false },
  R2: { name: 'Net griler ve desen', desc: 'Renk yok; öğünler ton ve desenle ayrılır: dolu açık, dolu orta, çizgili, noktalı. Makrolarda en büyük pay dolu, diğerleri dolu gri ve boş çerçeve.',
    seg: i => [{ col: 'var(--ink)' }, { col: 'var(--ink-muted)' }, { col: 'var(--ink)', dash: '3 3' }, { col: 'var(--ink-muted)', dash: '1 3' }][i],
    sw: i => ['background:var(--ink)', 'background:var(--ink-muted)', 'background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px);outline:1px solid var(--ink)', 'background:radial-gradient(var(--ink-muted) 35%,transparent 40%) 0 0/4px 4px;outline:1px solid var(--ink-muted)'][i],
    mac: (k, dom) => dom ? 'background:var(--ink)' : k === 'f' ? 'background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-muted)' : 'background:var(--ink-muted)', inside: false },
  R3: { name: 'Resimli halka', desc: 'Halka tek ton kalır, parçalar arasında açık boşluk; hangi parçanın hangi öğün olduğunu üstündeki yemek resmi söyler. Makrolar daha kalın, yazı barın içinde.',
    seg: i => ({ col: 'var(--ink-muted)', pic: true }), sw: i => 'display:none', mac: (k, dom) => dom ? 'background:var(--ink);color:var(--on-action)' : 'background:var(--surface-3);color:var(--ink)', inside: true },
};

function ring(D, r0) {
  const size = 196, w = r0 === R.R3 ? 18 : 14, c = size / 2, r = c - w / 2 - 4;
  const tracks = QS.map(s => stroke(arc(c, c, r, s + 3, s + 87), 'var(--surface-3)', w)).join('');
  let end = -999, pics = '';
  const gap = r0 === R.R3 ? 4 : 1.5;
  const segs = D.meals.map((v, i) => { if (!v) return ''; const s = Math.max(QS[i], end), e = s + v / T.kcal * 360; end = e; const st = r0.seg(i);
    if (st.pic) { const [x, y] = pt(c, c, r, (s + e) / 2); pics += `<circle cx="${f1(x)}" cy="${f1(y)}" r="17" fill="var(--surface-1)" stroke="var(--canvas)" stroke-width="3"/>${art(D.foods[i][0], 26, x - 13, y - 13)}`; }
    return stroke(arc(c, c, r, s + gap, e - gap), st.col, w, 'butt', st.dash ? `stroke-dasharray="${st.dash}"` : ''); }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${tracks}${segs}${pics}</svg>`;
}
function corners(D, r0) {
  const pos = ['left:0;top:0', 'right:0;top:0', 'right:0;bottom:0', 'left:0;bottom:0'];
  return MEALS.map((m, i) => { const r = i === 1 || i === 2 ? ' r' : '', sw = `<i class="sw" style="${r0.sw(i)}"></i>`;
    const body = D.meals[i] ? `<b>${n(D.meals[i])}</b><div class="fs">${D.foods[i].map(k => `<span>${art(k)}</span>`).join('')}</div>` : `<div class="addm">${ic('plus')}</div>`;
    return `<div class="corner${r}" style="${pos[i]}">${r ? m + sw : sw + m}${body}</div>`; }).join('');
}
const b1 = (D, r0) => { const s = share(D), dom = MACS.reduce((a, [k]) => s[k] > s[a] ? k : a, 'p');
  return `<div class="mac"><div class="mh"><span class="eyebrow">Kalorinin kaynağı</span><span class="fig">hedef %20 / %45 / %35</span></div><div class="b1 ${r0.inside ? 'in' : ''}">${MACS.map(([k, l]) => `<div style="flex:${s[k]}"><div class="bar" style="${r0.mac(k, k === dom)}">${r0.inside ? `%${Math.round(s[k])}` : ''}</div><div class="lab">${r0.inside ? '' : `<b>%${Math.round(s[k])}</b>`}${l}</div><div class="g">${n(D[k])} / ${n(T[k])} g</div></div>`).join('')}</div></div>`; };
const w3 = D => `<div class="w3">${D.week.map(([d, v], i) => { const today = d === '2026-10-20'; return `<div class="${i === 6 ? 'on' : ''}">${DN[day(d).getUTCDay()]}<b>${day(d).getUTCDate()}</b><em class="${v > T.kcal && !today ? 'ov' : ''}">${today ? 'bugün' : sg(v - T.kcal)}</em></div>`; }).join('')}</div>`;
const head = D => { const d = day(D.date); return `<div class="top"><div class="eyebrow">${DAYNAME[d.getUTCDay()]}, ${d.getUTCDate()} ${MONTH[d.getUTCMonth()]}</div><div class="title">${D.date === '2026-10-20' ? 'Bugün' : `${d.getUTCDate()} ${MONTH[d.getUTCMonth()]}`}</div></div>`; };
const screen = (D, r0) => `${head(D)}${w3(D)}<div class="frame"><div class="mid">${ring(D, r0)}<div class="center"><span class="num disp acc" style="font-size:44px">${n(T.kcal - D.kcal)}</span><span class="lbl">kcal kaldı</span><span class="tot"><b>${n(D.kcal)}</b> / ${n(T.kcal)}</span></div></div>${corners(D, r0)}</div>
  ${b1(D, r0)}<div class="ate"><div class="eyebrow">${D.open ? 'Bugün yediklerin' : 'O gün yediklerin'}</div>${D.ate.map(([k, t, s, kc]) => `<div class="fr"><span class="food">${art(k)}</span><span class="t">${t}<span>${s}</span></span><span class="k">${n(kc)}</span></div>`).join('')}</div>
  <div class="bottom"><button class="btn">${ic('plus')}${D.open ? 'Akşama ekle' : 'Bu güne ekle'}</button><span class="ibtn box">${ic('scan')}</span></div>`;
const phone = (mode, html, cap) => `<div><div class="phone" data-theme="${mode}" aria-label="${cap}">${html}</div><div class="cap">${cap}</div></div>`;
document.getElementById('all').innerHTML = Object.entries(R).map(([id, r0]) => `<h3>${id}. ${r0.name}</h3><p>${r0.desc}</p><div class="row">
  ${phone('dark', screen(AUG8, r0), '8 Ağustos, koyu')}${phone('light', screen(AUG8, r0), '8 Ağustos, açık')}${phone('dark', screen(OCT20, r0), '20 Ekim akşamdan sonra, koyu')}${phone('light', screen(OCT20, r0), '20 Ekim akşamdan sonra, açık')}</div>`).join('');

const zoom = document.getElementById('zoom');
document.addEventListener('click', e => {
  if (zoom.classList.contains('on')) { zoom.classList.remove('on'); zoom.innerHTML = ''; return; }
  const p = e.target.closest('.phone'); if (p) { zoom.innerHTML = p.outerHTML; zoom.classList.add('on'); }
});
</script>
</body>
</html>
